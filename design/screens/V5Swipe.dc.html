<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Процесс: свайпы в Подборке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v5swC1{0%,6%{transform:translate(0,0) rotate(0)}22%{transform:translate(70px,-6px) rotate(8deg)}26%{transform:translate(90px,0) rotate(10deg) scale(1)}37%{transform:translate(0,600px) rotate(0) scale(0.08);opacity:0.9}38%,100%{transform:translate(0,600px) scale(0.05);opacity:0}}
@keyframes v5swY1{0%,10%{opacity:0}20%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes v5swC2{0%,38%{transform:translate(0,14px) scale(0.96)}42%,46%{transform:translate(0,0) scale(1)}60%{transform:translate(-80px,-4px) rotate(-9deg)}70%,100%{transform:translate(-520px,30px) rotate(-24deg)}}
@keyframes v5swN2{0%,48%{opacity:0}58%,64%{opacity:1}68%,100%{opacity:0}}
@keyframes v5swC3{0%,38%{transform:translate(0,28px) scale(0.92)}42%,66%{transform:translate(0,14px) scale(0.96)}72%,80%{transform:translate(0,0) scale(1)}90%{transform:translate(0,-40px) scale(1)}100%{transform:translate(0,0) scale(1)}}
@keyframes v5swFinger{0%,6%{left:200px;top:440px;opacity:0}9%{opacity:1}22%{left:290px;top:430px;opacity:1}26%{opacity:0}46%{left:200px;top:440px;opacity:0}49%{opacity:1}60%{left:110px;top:436px;opacity:1}64%,80%{opacity:0;left:200px;top:500px}83%{opacity:1}90%{left:200px;top:400px;opacity:1}94%,100%{opacity:0}}
@keyframes v5swTab{0%,36%{transform:scale(1)}39%{transform:scale(1.25)}44%,100%{transform:scale(1)}}
@keyframes v5swPlus{0%,36%{opacity:0;transform:translateY(6px)}40%{opacity:1;transform:translateY(-10px)}52%,100%{opacity:0;transform:translateY(-30px)}}
@keyframes v5swCap1{0%,6%{opacity:0}9%,38%{opacity:1}40%,100%{opacity:0}}
@keyframes v5swCap2{0%,46%{opacity:0}49%,70%{opacity:1}72%,100%{opacity:0}}
@keyframes v5swCap3{0%,80%{opacity:0}83%,96%{opacity:1}98%,100%{opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="padding: 58px 20px 0; display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'Geologica', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">Подборка</span><span style="padding: 9px 14px; border-radius: 16px; background: #E7E2D6; font-size: 14px; font-weight: 600">Для тебя</span></div>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<div style="position: absolute; left: 20px; top: 130px; width: 350px; height: 520px; border-radius: 28px; overflow: hidden; background: #17161A; box-shadow: 0 20px 40px rgba(23,22,26,0.2); z-index: {{c.z}}; animation: {{c.anim}} 12s cubic-bezier(.4,0,.2,1) infinite; transform-origin: 50% 90%">
<img src="{{c.photo}}" alt="" style="width: 350px; height: 380px; object-fit: cover; display: block">
<div style="padding: 16px 18px; color: #F3F0E8"><div style="font-family: 'Geologica', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">{{c.title}}</div><div style="margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #CFC9BB">{{c.meta}}</div></div>
<sc-if value="{{c.yes}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 22px; top: 26px; padding: 6px 14px; border: 4px solid #F0521F; border-radius: 14px; background: rgba(251,250,246,0.92); color: #F0521F; font-family: 'Geologica', sans-serif; font-size: 30px; font-weight: 800; transform: rotate(-10deg); animation: v5swY1 12s ease infinite">ПОЙДУ</span></sc-if>
<sc-if value="{{c.no}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 22px; top: 26px; padding: 6px 14px; border: 4px solid #17161A; border-radius: 14px; background: rgba(251,250,246,0.92); color: #17161A; font-family: 'Geologica', sans-serif; font-size: 30px; font-weight: 800; transform: rotate(10deg); animation: v5swN2 12s ease infinite">МИМО</span></sc-if>
</div>
</sc-for>
<span aria-hidden="true" style="position: absolute; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(23,22,26,0.22); border: 4px solid rgba(251,250,246,0.95); box-sizing: border-box; z-index: 10; animation: v5swFinger 12s cubic-bezier(.4,0,.2,1) infinite"></span>
<div aria-hidden="true" style="position: absolute; left: 0; top: 664px; width: 390px; height: 40px; display: flex; justify-content: center; z-index: 11">
<sc-for list="{{caps}}" as="k" hint-placeholder-count="3"><span style="position: absolute; padding: 9px 14px; border-radius: 14px; background: #17161A; color: #F3F0E8; font-size: 13.5px; font-weight: 700; white-space: nowrap; opacity: 0; animation: {{k.anim}} 12s ease infinite">{{k.t}}</span></sc-for>
</div>
<span aria-hidden="true" style="position: absolute; left: 196px; top: 742px; z-index: 12; font-family: 'Geologica', sans-serif; font-weight: 800; font-size: 18px; color: #F0521F; opacity: 0; animation: v5swPlus 12s ease infinite">+1</span>
<div style="position: absolute; left: 0; bottom: 0; z-index: 9; transform-origin: 195px 60px; animation: v5swTab 12s ease infinite"><dc-import name="V3TabBar" active="feed" plans="2" chats="1" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cards: [
        { z: '3', anim: 'v5swC1', photo: '../assets/pub.jpg', title: 'Открытый микрофон', meta: 'ПТ · 20:00 · 1,2 КМ · 0 ₸', yes: true, no: false },
        { z: '2', anim: 'v5swC2', photo: '../assets/museum.jpg', title: 'Ночь в музее', meta: 'СБ · 19:00 · 3 КМ · 2 000 ₸', yes: false, no: true },
        { z: '1', anim: 'v5swC3', photo: '../assets/hike.jpg', title: 'Поход на рассвете', meta: 'ВС · 06:00 · МЕДЕУ', yes: false, no: false }
      ],
      caps: [['вправо — «Пойду», летит в «Планы»', 'v5swCap1'], ['влево — мимо, больше такого не покажем', 'v5swCap2'], ['вверх — открыть событие', 'v5swCap3']].map(([t, anim]) => ({ t, anim }))
    };
  }
}
</script>
</body>
</html>
