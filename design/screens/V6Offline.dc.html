<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Нет сети, нет геолокации — коротко</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v6ofDrop{0%{transform:translateY(-70px)}100%{transform:translateY(0)}}
@keyframes v6ofBlink{0%,100%{opacity:1}50%{opacity:0.45}}
@keyframes v6ofIn{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes v6ofAcc{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.18);opacity:0.6}}
@keyframes v6ofWob{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,-6px)}50%{transform:translate(-6px,8px)}75%{transform:translate(-10px,-4px)}}
@keyframes v6tbFill{0%{fill:rgba(23,22,26,0);stroke:#5F5B55}100%{fill:#17161A;stroke:#17161A}}
@keyframes v6tbDet{0%{stroke:#5F5B55}100%{stroke:#FBFAF6}}
@keyframes v6tbPop{0%{transform:scale(0.84)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes v6tbRing{0%{border-color:transparent;transform:scale(0.84)}55%{transform:scale(1.1)}100%{border-color:#17161A;transform:scale(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEBE2; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; inset: 0; filter: {{mapFilter}}"><dc-import name="MapBase" theme="paper" hint-size="390px,844px"></dc-import>
<sc-for list="{{friends}}" as="f" hint-placeholder-count="3"><img src="{{f.p}}" alt="" style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 3px solid #FBFAF6; box-sizing: border-box; box-shadow: 0 6px 14px rgba(23,22,26,0.2); opacity: {{fOpacity}}; filter: {{fFilter}}"></sc-for>
</div>
<sc-if value="{{showMe}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; left: {{acc.x}}px; top: {{acc.y}}px; width: {{acc.s}}px; height: {{acc.s}}px; border-radius: 50%; background: rgba(240,82,31,0.13); border: 1.5px solid rgba(240,82,31,0.35); box-sizing: border-box; animation: v6ofAcc 2.6s ease-in-out infinite"></span>
<span aria-hidden="true" style="position: absolute; left: 182px; top: 420px; width: 26px; height: 26px; border-radius: 50%; background: {{meBg}}; border: 4px solid #FBFAF6; box-sizing: border-box; box-shadow: 0 4px 12px rgba(23,22,26,0.3); animation: {{meAnim}} 6s ease-in-out infinite"></span>
</sc-if>
<sc-if value="{{isOffline}}" hint-placeholder-val="{{ true }}">
<div role="status" style="position: absolute; left: 50%; top: 146px; margin-left: -88px; width: 176px; height: 40px; border-radius: 20px; background: #17161A; color: #F3F0E8; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; font-weight: 600; box-shadow: 0 8px 20px rgba(23,22,26,0.25); animation: v6ofDrop 500ms cubic-bezier(.2,.8,.2,1) both">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7B08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: v6ofBlink 1.6s ease infinite"><path d="M2 2l20 20M8.5 16.5a5 5 0 017 0M5 12.6a10 10 0 015.2-2.5M19 12.6a10 10 0 00-2.4-1.7M2 8.8a15 15 0 014.2-2.6M22 8.8A15 15 0 0010.7 5M12 20h.01"></path></svg>
Нет интернета
</div>
</sc-if>
<sc-if value="{{isNoGeo}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 30px; right: 30px; top: 300px; padding: 28px 22px 22px; border-radius: 30px; background: #FBFAF6; box-shadow: 0 20px 50px rgba(23,22,26,0.25); text-align: center; animation: v6ofIn 500ms cubic-bezier(.2,.8,.2,1) both">
<span style="display: inline-flex; width: 64px; height: 64px; border-radius: 22px; background: #F0521F; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg></span>
<div style="margin-top: 16px; font-family: 'Geologica', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.03em">Включи геолокацию</div>
<button type="button" style="margin-top: 18px; width: 100%; height: 54px; border: 0; border-radius: 18px; background: #17161A; color: #F3F0E8; font-family: 'Golos Text', sans-serif; font-size: 17px; font-weight: 700">Включить</button>
</div>
</sc-if>
<div style="position: absolute; left: 0; top: 0; z-index: 0"><dc-import name="V6MapTop" lens="normal" hint-size="390px,140px"></dc-import></div>
<div style="position: absolute; left: 0; bottom: 0"><dc-import name="V6TabBar" active="map" plans="2" chats="1" hint-size="390px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["offline","nogeo","gps"],"default":"offline"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mode ?? 'offline';
    const big = m === 'gps';
    const s = big ? 220 : 60;
    return {
      isOffline: m === 'offline', isNoGeo: m === 'nogeo', showMe: m !== 'nogeo',
      mapFilter: m === 'nogeo' ? 'blur(3px) saturate(0.6)' : m === 'offline' ? 'saturate(0.35)' : 'none',
      fOpacity: '1', fFilter: 'none',
      meBg: m === 'offline' ? '#8F897C' : '#F0521F', meAnim: big ? 'v6ofWob' : 'none',
      acc: { x: String(195 - s / 2), y: String(433 - s / 2), s: String(s) },
      friends: [['../assets/igor.jpg', 96, 250], ['../assets/arman.jpg', 262, 330], ['../assets/mira.jpg', 60, 560]].map(([p, x, y]) => ({ p, x: String(x), y: String(y) }))
    };
  }
}
</script>
</body>
</html>
