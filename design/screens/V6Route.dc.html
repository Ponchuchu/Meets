<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как добраться: пешком, машина, автобус — на карте</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v6rtDraw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes v6rtSheet{from{transform:translateY(400px)}to{transform:translateY(0)}}
@keyframes v6rtBus{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes v6rtPulse{0%{transform:scale(0.7);opacity:0.7}100%{transform:scale(2);opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEBE2; font-family: 'Golos Text', sans-serif; color: #17161A">
<dc-import name="MapBase" theme="paper" hint-size="390px,844px"></dc-import>
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="6"><path d="{{l.d}}" fill="none" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-opacity="{{l.o}}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="{{l.dash}}" style="animation: {{l.anim}} 1.4s cubic-bezier(.4,0,.2,1) both"></path></sc-for>
<sc-if value="{{isBus}}" hint-placeholder-val="{{ true }}"><sc-for list="{{stops}}" as="p" hint-placeholder-count="4"><circle cx="{{p.x}}" cy="{{p.y}}" r="6" fill="#FBFAF6" stroke="#2447B8" stroke-width="3"></circle></sc-for></sc-if>
</svg>
<sc-if value="{{isBus}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 34px; height: 22px; margin: -11px 0 0 -17px; border-radius: 8px; background: #2447B8; color: #FBFAF6; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; offset-path: path('M126 498 L126 294 L306 294'); offset-rotate: 0deg; animation: v6rtBus 7s linear infinite">63</span></sc-if>
<span aria-hidden="true" style="position: absolute; left: 76px; top: 484px; width: 28px; height: 28px; border-radius: 50%; background: rgba(240,82,31,0.3); animation: v6rtPulse 2s ease-out infinite"></span>
<span aria-label="Ты здесь" style="position: absolute; left: 78px; top: 486px; width: 24px; height: 24px; border-radius: 50%; background: #F0521F; border: 4px solid #FBFAF6; box-sizing: border-box"></span>
<span aria-label="Hoper's bar" style="position: absolute; left: 288px; top: 200px; width: 36px; height: 36px; border-radius: 12px; background: #17161A; border: 3px solid #FBFAF6; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7B08A" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0"></path></svg></span>
<div style="position: absolute; left: 12px; right: 12px; top: 52px; height: 56px; box-sizing: border-box; padding: 0 6px; border-radius: 20px; background: rgba(251,250,246,0.97); box-shadow: 0 6px 18px rgba(23,22,26,0.12); display: flex; align-items: center; gap: 6px">
<span role="button" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
<div><div style="font-size: 12px; color: #5F5B55">до Hoper's bar · Гагарина, 93а</div><div style="font-family: 'Geologica', sans-serif; font-size: 17px; font-weight: 800">Жёсткий стендап · 20:00</div></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 16px 30px; border-radius: 30px 30px 0 0; background: #FBFAF6; box-shadow: 0 -10px 40px rgba(23,22,26,0.15); animation: v6rtSheet 500ms cubic-bezier(.2,.8,.2,1) both">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><div style="height: 60px; border-radius: 16px; background: {{m.bg}}; color: {{m.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.i}}"></path></svg><span style="font-family: 'Geologica', sans-serif; font-size: 16px; font-weight: 800">{{m.t}}</span></div></sc-for>
</div>
<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 12px"><span style="width: 32px; height: 32px; border-radius: 10px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; flex-shrink: 0"><sc-if value="{{s.hasIcon}}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.i}}"></path></svg></sc-if>{{s.k}}</span><div style="flex: 1"><div style="font-size: 15px; font-weight: 700">{{s.t}}</div><div style="font-size: 12.5px; color: #5F5B55">{{s.s}}</div></div></div></sc-for>
</div>
<div style="margin-top: 16px; display: flex; gap: 8px">
<span style="flex: 1; height: 52px; border-radius: 16px; background: #17161A; color: #F3F0E8; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{cta}}</span>
<span style="height: 52px; padding: 0 16px; border-radius: 16px; background: #EDE9DF; font-size: 15px; font-weight: 700; display: flex; align-items: center">В 2ГИС</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["bus","car","walk"],"default":"bus"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mode ?? 'bus';
    const I = { walk: 'M13 4a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM10 21l2-6 3 3v3M9 12l2-4 3 2 3 1M11 8l-3 3', car: 'M5 16h14l-1.5-5.5A2 2 0 0015.6 9H8.4a2 2 0 00-1.9 1.5zM5 16v3M19 16v3', bus: 'M6 4h12a2 2 0 012 2v10H4V6a2 2 0 012-2zM4 12h16M8 20l1-4M16 20l-1-4' };
    const L = {
      walk: [['M90 498L198 498L198 294L306 294L306 226', '#17161A', 5, '1 10']],
      car: [['M90 498L90 396', '#2F8F5B', 7, ''], ['M90 396L270 396', '#C2321F', 7, ''], ['M270 396L270 226L306 226', '#E0A21B', 7, '']],
      bus: [['M90 498L126 498', '#17161A', 4, '1 8'], ['M126 498L126 294L306 294', '#2447B8', 7, ''], ['M306 294L306 226', '#17161A', 4, '1 8']]
    };
    const lines = [];
    for (const k of ['walk', 'car', 'bus']) for (const [d, c, w, dash] of L[k]) {
      const on = k === m;
      lines.push({ d, c: on ? c : '#8F897C', w: String(on ? w : 3), o: on ? '1' : '0.35', dash: dash || (on ? '900' : 'none'), anim: on && !dash ? 'v6rtDraw' : 'none' });
    }
    lines.sort((a, b) => Number(a.o) - Number(b.o));
    const IC = { walk: I.walk, clock: 'M12 3a9 9 0 110 18 9 9 0 010-18zM12 7v5l3 2', taxi: I.car, park: 'M6 21V4h7a5 5 0 010 10H6', sun: 'M12 7a5 5 0 110 10 5 5 0 010-10zM12 2v2M12 20v2M2 12h2M20 12h2', up: 'M3 20l7-10 4 5 3-3 4 8z' };
    const S = {
      bus: [['walk', '', '4 мин пешком', 'до остановки «Абая — Гагарина»'], ['', '63', 'Автобус 63 · через 4 мин', '6 остановок · следующий через 15 мин'], ['walk', '', '3 мин пешком', 'до Hoper\'s bar']],
      car: [['clock', '', '9 минут · 3,2 км', 'на Абая пробка 6 баллов, +3 мин'], ['taxi', '', 'Такси ~1 200 ₸', 'по данным сервиса такси'], ['park', '', 'Парковка во дворе', 'со слов организатора']],
      walk: [['walk', '', '18 минут · 1,4 км', 'по Абая и Гагарина'], ['sun', '', 'На улице +14°', 'без дождя'], ['up', '', 'Подъём 30 м', 'в сторону гор']]
    }[m];
    return {
      isBus: m === 'bus', lines,
      stops: [[126, 498], [126, 396], [126, 294], [230, 294]].map(([x, y]) => ({ x: String(x), y: String(y) })),
      modes: [['walk', '18 мин'], ['car', '9 мин'], ['bus', '22 мин']].map(([k, t]) => ({ t, i: I[k], bg: k === m ? '#17161A' : '#EDE9DF', fg: k === m ? '#F3F0E8' : '#17161A' })),
      steps: S.map(([ic, k, t, s2], i) => ({ hasIcon: !!ic, i: ic ? IC[ic] : '', k, t, s: s2, bg: i === 1 && m === 'bus' ? '#2447B8' : '#EDE9DF', fg: i === 1 && m === 'bus' ? '#FBFAF6' : '#17161A' })),
      cta: m === 'car' ? 'Вызвать такси' : 'Поехали'
    };
  }
}
</script>
</body>
</html>
