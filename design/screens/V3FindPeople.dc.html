<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Найти людей v3: кто идёт туда же, друзья друзей</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3Bump{0%{transform:scale(0.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.v3bump{animation:v3Bump 320ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; padding: 48px 0 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 10px; padding: 0 16px">
<a href="V3Chats.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 50%; background: #FBFAF6; border: 1px solid #DDD8CC; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex-grow: 1; height: 46px; border-radius: 23px; background: #FBFAF6; border: 1px solid #DDD8CC; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: #8F897C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A3833" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 110 14 7 7 0 010-14zM20 20l-4-4"></path></svg>Имя или @ник</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px">
<sc-for list="{{ways}}" as="w" hint-placeholder-count="3">
<button type="button" style="height: 76px; border-radius: 18px; border: 0; background: {{w.bg}}; color: {{w.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'Golos Text', sans-serif; font-size: 13px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg>{{w.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
<span style="font-family: 'Geologica', sans-serif; font-size: 19px; font-weight: 700">Идут туда же</span>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 22px; background: #FBFAF6; border: 1px solid #DDD8CC">
<a href="V3Event.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #17161A">
<span style="width: 36px; height: 36px; border-radius: 11px; background: {{g.tint}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{g.title}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: #3A3833">{{g.when}}</span>
</a>
<div style="display: flex; gap: 12px; overflow-x: auto; flex-shrink: 0; padding: 2px 2px 4px">
<sc-for list="{{g.people}}" as="m" hint-placeholder-count="4">
<span style="display: flex; flex-direction: column; align-items: center; gap: 7px; width: 62px; flex-shrink: 0">
<span style="position: relative; width: 58px; height: 58px">
<a href="V3Person.dc.html" aria-label="{{m.name}}" style="display: block; text-decoration: none; color: #17161A">
<sc-if value="{{m.hasPhoto}}" hint-placeholder-val="{{ true }}"><img src="{{m.photo}}" alt="" style="width: 58px; height: 58px; border-radius: 50%; object-fit: cover; display: block"></sc-if>
<sc-if value="{{m.noPhoto}}" hint-placeholder-val="{{ false }}"><span style="width: 58px; height: 58px; border-radius: 50%; background: {{m.tint}}; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700">{{m.initial}}</span></sc-if>
</a>
<sc-if value="{{m.alone}}" hint-placeholder-val="{{ true }}"><span aria-label="Ищет компанию" style="position: absolute; left: -4px; top: -4px; width: 22px; height: 22px; border-radius: 50%; background: #F0521F; box-shadow: 0 0 0 2.5px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 013 0V11M11 10.5V4a1.5 1.5 0 013 0v6.5M14 10V5.5a1.5 1.5 0 013 0V13M17 9.5a1.5 1.5 0 013 0V14a7 7 0 01-7 7h-1a6 6 0 01-5-2.7L4.5 15a1.6 1.6 0 012.6-1.8L8 14.5"></path></svg></span></sc-if>
<button type="button" onClick="{{m.add}}" aria-label="{{m.aria}}" class="{{m.cls}}" style="position: absolute; right: -8px; bottom: -8px; width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; background: {{m.bg}}; box-shadow: 0 0 0 3px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg></button>
</span>
<span style="font-size: 12.5px; font-weight: 600">{{m.name}}</span>
</span>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
<span style="font-family: 'Geologica', sans-serif; font-size: 19px; font-weight: 700">Друзья друзей</span>
<sc-for list="{{fof}}" as="f" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<a href="V3Person.dc.html" style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0; text-decoration: none; color: #17161A">
<sc-if value="{{f.hasPhoto}}" hint-placeholder-val="{{ true }}"><img src="{{f.photo}}" alt="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0"></sc-if><sc-if value="{{f.noPhoto}}" hint-placeholder-val="{{ false }}"><span style="width: 50px; height: 50px; border-radius: 50%; background: {{f.tint}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0">{{f.initial}}</span></sc-if>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 15.5px; font-weight: 700">{{f.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #3A3833"><span style="display: flex"><sc-for list="{{f.via}}" as="v" hint-placeholder-count="2"><img src="{{v}}" alt="" style="width: 20px; height: 20px; margin-right: -6px; border-radius: 50%; object-fit: cover; border: 2px solid #F3F0E8"></sc-for></span><span style="margin-left: 6px">{{f.mutual}}</span></span>
</span>
</a>
<button type="button" onClick="{{f.add}}" aria-label="{{f.aria}}" class="{{f.cls}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 0; background: {{f.bg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{f.fg}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg></button>
</div>
</sc-for>
<a href="V3FriendsOf.dc.html" style="align-self: flex-start; height: 40px; padding: 0 8px 0 14px; border-radius: 20px; background: #E7E2D6; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #17161A; text-decoration: none">Друзья Игоря<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { added: {} };
  }
  renderVals() {
    const added = this.state.added;
    const ADD = 'M12 5v14M5 12h14';
    const WAIT = 'M12 7v5l3 2';
    const P = { igor: '../assets/igor.jpg', denis: '../assets/denis.jpg', anton: '../assets/anton.jpg', ainura: '../assets/ainura.jpg' };
    const btn = (id, name) => {
      const on = !!added[id];
      return { icon: on ? WAIT : ADD, bg: on ? '#E7E2D6' : '#2447B8', fg: on ? '#17161A' : '#FBFAF6', cls: on ? 'v3bump' : '', aria: on ? 'Запрос отправлен: ' + name : 'Добавить в друзья: ' + name, add: () => this.setState({ added: { ...this.state.added, [id]: !on } }) };
    };
    const person = (id, name, photo, tint, alone) => ({ name, hasPhoto: !!photo, noPhoto: !photo, photo: photo || '', initial: name[0], tint: tint || '#E7E2D6', alone: !!alone, ...btn(id, name) });
    return {
      ways: [
        { label: 'Контакты', bg: '#FBFAF6', fg: '#17161A', icon: 'M6 3h12v18H6zM10 9a2 2 0 104 0 2 2 0 00-4 0M8.5 16c.5-1.8 1.8-2.8 3.5-2.8s3 1 3.5 2.8M4 7h2M4 12h2M4 17h2' },
        { label: 'Мой QR', bg: '#FBFAF6', fg: '#17161A', icon: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2M14 18h2v2M18 18h2v2' },
        { label: 'Рядом', bg: '#17161A', fg: '#F3F0E8', icon: 'M12 10a2 2 0 110 4 2 2 0 010-4zM8 8a5.5 5.5 0 000 8M16 8a5.5 5.5 0 010 8M5 5a9.5 9.5 0 000 14M19 5a9.5 9.5 0 010 14' }
      ],
      groups: [
        { title: 'Джаз во дворе', when: '19:30', tint: '#F0521F', iconFg: '#17161A', icon: 'M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z', people: [person('ainura', 'Айнура', P.ainura, '', true), person('erlan', 'Ерлан', '../assets/erlan.jpg', '', true), person('mira', 'Мира', '../assets/mira.jpg', '', true), person('marat', 'Марат', '', '#EADFB8', true), person('sasha', 'Саша', '', '#D9E4D2')] },
        { title: 'Настолки', when: 'ПТ 20:00', tint: '#D6E0EE', iconFg: '#17161A', icon: 'M7 4h10a3 3 0 013 3v10a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3zM9 9h.01M15 15h.01M15 9h.01M9 15h.01', people: [person('dina', 'Дина', '', '#E5D3DC', true), person('alya', 'Аля', '', '#E5D3DC', true), person('ruslan', 'Руслан', '', '#D9E4D2')] }
      ],
      fof: [
        { id: 'kamila', name: 'Камила', photo: '../assets/kamila.jpg', tint: '#E5D3DC', via: [P.igor, P.denis], mutual: '2 общих' },
        { id: 'daniel', name: 'Даниэль', photo: '../assets/daniel.jpg', tint: '#D6E0EE', via: [P.anton], mutual: '1 общий' },
        { id: 'zhanna', name: 'Жанна', tint: '#EADFB8', via: [P.igor, P.anton], mutual: '2 общих' }
      ].map((f) => { const on = !!added[f.id]; return { ...f, hasPhoto: !!f.photo, noPhoto: !f.photo, photo: f.photo || '', initial: f.name[0], ...btn(f.id, f.name), bg: on ? '#E7E2D6' : '#D6E0EE', fg: on ? '#17161A' : '#2447B8' }; })
    };
  }
}
</script>
</body>
</html>
