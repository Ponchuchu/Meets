<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Событие v2: кого позвать</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v2Up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v2Ring{0%{transform:scale(0.5);opacity:0.9}100%{transform:scale(1.9);opacity:0}}
@keyframes v2Plus{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes v2Bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes v2Toast{0%{transform:translateY(-16px);opacity:0}12%{transform:translateY(0);opacity:1}88%{opacity:1}100%{opacity:0}}
.v2up{animation:v2Up 260ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
<dc-import name="V2Event" step="friends" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
