<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разработчик: событие на карте</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v5dIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes v5dType{from{opacity:0}to{opacity:1}}
@keyframes v5dStep{0%{opacity:0.35}100%{opacity:1}}
@keyframes v5dTick{0%{transform:scale(0);background:#DDD8CC}70%{transform:scale(1.2);background:#2F8F5B}100%{transform:scale(1);background:#2F8F5B}}
@keyframes v5dSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes v5dBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes v5dField{0%{background:#FCE3D6}100%{background:#FBFAF6}}
@keyframes v5dDrop{0%{transform:translateY(-300px);opacity:0}60%{transform:translateY(8px);opacity:1}75%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes v5dRing{0%{transform:scale(0.4);opacity:0.9}100%{transform:scale(3);opacity:0}}
@keyframes v5dToast{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes v5dGlow{0%,100%{box-shadow:0 0 0 0 rgba(240,82,31,0.45)}50%{box-shadow:0 0 0 8px rgba(240,82,31,0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
<dc-import name="V5Dev" stage="map" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
