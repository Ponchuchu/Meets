<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта v3: события на сутки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3Up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v3Pulse{0%{transform:scale(0.6);opacity:0.6}100%{transform:scale(2.4);opacity:0}}
@keyframes v3Pill{0%{transform:translateY(-12px);opacity:0}15%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
.v3up{animation:v3Up 260ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEBE2; font-family: 'Golos Text', sans-serif; color: #17161A">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="MapBase" theme="paper" hint-size="390px,844px"></dc-import>
</div>

<sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.select}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 4px; cursor: pointer">
<span style="width: {{p.size}}px; height: {{p.size}}px; border-radius: 12px; background: {{p.bg}}; box-shadow: {{p.shadow}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
<sc-if value="{{p.showLabel}}" hint-placeholder-val="{{ true }}"><span style="padding: 3px 7px; border-radius: 8px; background: #17161A; color: #F3F0E8; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; white-space: nowrap">{{p.label}}</span></sc-if>
</button>
</sc-for>

<span aria-hidden="true" style="position: absolute; left: 335px; top: 318px; width: 5px; height: 5px; border-radius: 50%; background: #2447B8; opacity: 0.25"></span>
<span aria-hidden="true" style="position: absolute; left: 326px; top: 328px; width: 6px; height: 6px; border-radius: 50%; background: #2447B8; opacity: 0.45"></span>
<sc-for list="{{friends}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.select}}" aria-label="{{f.aria}}" style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
<sc-if value="{{f.hasPhoto}}" hint-placeholder-val="{{ true }}"><img src="{{f.photo}}" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box; box-shadow: 0 0 0 2px #FBFAF6, 0 4px 10px rgba(23,22,26,0.25); display: block"></sc-if>
<sc-if value="{{f.noPhoto}}" hint-placeholder-val="{{ false }}"><span style="width: 40px; height: 40px; border-radius: 50%; background: #D9E4D2; border: 3px solid #2447B8; box-sizing: border-box; box-shadow: 0 0 0 2px #FBFAF6; display: flex; align-items: center; justify-content: center; font-weight: 700">{{f.initial}}</span></sc-if>
<span style="position: absolute; right: -2px; bottom: 0; width: 22px; height: 22px; border-radius: 50%; background: {{f.badgeBg}}; box-shadow: 0 0 0 2px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{f.badgeFg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.badge}}"></path></svg></span>
</button>
</sc-for>

<span aria-hidden="true" style="position: absolute; left: 168px; top: 466px; width: 24px; height: 24px; border-radius: 50%; background: rgba(36,71,184,0.25); animation: v3Pulse 2s ease-out infinite"></span>
<span aria-label="Я здесь" style="position: absolute; left: 172px; top: 470px; width: 16px; height: 16px; border-radius: 50%; background: #2447B8; box-shadow: 0 0 0 3px #FBFAF6, 0 2px 6px rgba(23,22,26,0.3)"></span>

<div style="position: absolute; left: 16px; right: 16px; top: 52px; display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 48px; border-radius: 24px; border: 1px solid rgba(23,22,26,0.08); background: rgba(251,250,246,0.95); box-shadow: 0 4px 14px rgba(23,22,26,0.12); display: flex; align-items: center; gap: 10px; padding: 0 16px; font-family: 'Golos Text', sans-serif; font-size: 15px; color: #55524C; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Поиск</button>
<button type="button" onClick="{{openFilter}}" aria-label="Фильтр и даты" style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(23,22,26,0.08); background: rgba(251,250,246,0.95); box-shadow: 0 4px 14px rgba(23,22,26,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg><sc-if value="{{filterOn}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: #F0521F; box-shadow: 0 0 0 2px #FBFAF6"></span></sc-if></button>
<button type="button" onClick="{{openPlus}}" aria-label="Создать" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 0; background: #17161A; box-shadow: 0 4px 14px rgba(23,22,26,0.2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="position: absolute; left: 16px; top: 108px; display: flex; gap: 6px">
<button type="button" onClick="{{openFilter}}" style="height: 32px; padding: 0 11px; border-radius: 16px; border: 0; background: rgba(23,22,26,0.88); color: #F3F0E8; display: flex; align-items: center; gap: 6px; font-family: 'Golos Text', sans-serif; font-size: 13px; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{whenLabel}}</button>
<span style="height: 32px; padding: 0 10px; border-radius: 16px; background: rgba(251,250,246,0.85); display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C77A12" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>+21°</span>
</div>

<button type="button" aria-label="Где я" style="position: absolute; right: 16px; top: 640px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(23,22,26,0.08); background: rgba(251,250,246,0.95); box-shadow: 0 4px 14px rgba(23,22,26,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg></button>

<sc-if value="{{isPin}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 12px; right: 12px; bottom: 104px; box-sizing: border-box; padding: 12px; border-radius: 22px; background: #FBFAF6; box-shadow: 0 10px 28px rgba(23,22,26,0.2); display: flex; flex-direction: column; gap: 12px">
<a href="V3Event.dc.html" style="display: flex; gap: 12px; align-items: center; text-decoration: none; color: #17161A">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #F0521F; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
<span style="font-family: 'Geologica', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.1">Джаз во дворе</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; color: #3A3833">СЕГОДНЯ 19:30 · 0 ₸</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="display: flex"><img src="../assets/igor.jpg" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 2px solid #2447B8; box-sizing: border-box"><img src="../assets/denis.jpg" alt="" style="width: 24px; height: 24px; margin-left: -7px; border-radius: 50%; object-fit: cover; border: 2px solid #2447B8; box-sizing: border-box"><img src="../assets/ainura.jpg" alt="" style="width: 24px; height: 24px; margin-left: -7px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6; box-sizing: border-box"></span><span style="font-size: 13px; font-weight: 600; color: #3A3833">+35</span></span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<sc-if value="{{notGoing}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{go}}" style="height: 50px; border-radius: 14px; border: 0; background: #F0521F; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700; color: #17161A">Пойду</button>
</sc-if>
<sc-if value="{{going}}" hint-placeholder-val="{{ false }}">
<a href="V3Plans.dc.html" style="height: 50px; border-radius: 14px; background: #D9E4D2; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; color: #17161A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Иду · в Планах</a>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isFriend}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 12px; right: 12px; bottom: 104px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #FBFAF6; box-shadow: 0 10px 28px rgba(23,22,26,0.2); display: flex; flex-direction: column; gap: 14px">
<a href="V3Person.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #17161A">
<span style="position: relative; width: 56px; height: 56px; flex-shrink: 0"><img src="../assets/igor.jpg" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box"><span style="position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: #C77A12; box-shadow: 0 0 0 2px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-family: 'Geologica', sans-serif; font-size: 20px; font-weight: 700">Игорь</span><span style="font-size: 14px; color: #3A3833">Кофейня Saya</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="V3Chat.dc.html" style="height: 64px; border-radius: 16px; background: #17161A; color: #F3F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Написать</a>
<button type="button" onClick="{{sticker}}" style="height: 64px; border-radius: 16px; border: 0; background: #F3F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Golos Text', sans-serif; font-size: 12.5px; font-weight: 600; color: #17161A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3H6a3 3 0 00-3 3v12a3 3 0 003 3h7l8-8V6a3 3 0 00-3-3zM13 21v-5a3 3 0 013-3h5M8.5 10h.01M14.5 10h.01M9 14.5c1.5 1.2 4.5 1.2 6 0"></path></svg>{{stickerLabel}}</button>
<a href="V3EventHow.dc.html" style="height: 64px; border-radius: 16px; background: #F3F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12.5px; font-weight: 600; color: #17161A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h12a3 3 0 013 3v10.5a3 3 0 01-3 3H6a3 3 0 01-3-3V7.5a3 3 0 013-3zM3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"></path></svg>Позвать</a>
</div>
</div>
</sc-if>

<sc-if value="{{showPill}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 150px; transform: translateX(-50%); padding: 8px 14px; border-radius: 18px; background: #17161A; color: #F3F0E8; font-size: 14px; font-weight: 600; white-space: nowrap; animation: v3Pill 2.6s ease both">{{pillText}}</div>
</sc-if>

<sc-if value="{{hasModal}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{close}}" aria-label="Закрыть" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; background: rgba(23,22,26,0.34)"></button>
</sc-if>

<sc-if value="{{isFilter}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 28px; border-radius: 24px 24px 0 0; background: #FBFAF6; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFC9BB"></span>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 700">Когда</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{whens}}" as="w" hint-placeholder-count="4">
<button type="button" onClick="{{w.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{w.border}}; background: {{w.bg}}; color: {{w.fg}}; font-family: 'Golos Text', sans-serif; font-size: 14px; font-weight: 600">{{w.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{days}}" as="c" hint-placeholder-count="14">
<button type="button" onClick="{{c.pick}}" style="height: 44px; border-radius: 12px; border: 0; background: {{c.bg}}; color: {{c.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-family: 'Golos Text', sans-serif; padding: 0"><span style="font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; opacity: 0.75">{{c.wd}}</span><span style="font-size: 15px; font-weight: 700">{{c.n}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 700">Что</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="8">
<button type="button" onClick="{{k.toggle}}" style="height: 66px; border-radius: 16px; border: 0; background: {{k.bg}}; color: {{k.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Golos Text', sans-serif; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg>{{k.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E7E2D6">
<sc-for list="{{prices}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" style="height: 40px; border-radius: 11px; border: 0; background: {{o.bg}}; box-shadow: {{o.shadow}}; font-family: 'Golos Text', sans-serif; font-size: 14px; font-weight: 600; color: #17161A">{{o.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{reset}}" style="height: 54px; padding: 0 18px; border-radius: 16px; border: 1px solid #CFC9BB; background: #FBFAF6; font-family: 'Golos Text', sans-serif; font-size: 15px; font-weight: 600">Сбросить</button>
<button type="button" onClick="{{close}}" style="flex-grow: 1; height: 54px; border-radius: 16px; border: 0; background: #17161A; color: #F3F0E8; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 600">{{showCta}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{isPlus}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 30px; border-radius: 24px 24px 0 0; background: #FBFAF6; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFC9BB"></span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="CreateEvent.dc.html" style="height: 128px; border-radius: 20px; background: #2447B8; color: #FBFAF6; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; box-sizing: border-box; text-decoration: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M19 8v6M16 11h6"></path></svg><span style="font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.1">Собрать друзей</span></a>
<a href="Suggest.dc.html" style="height: 128px; border-radius: 20px; background: #F0521F; color: #17161A; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; box-sizing: border-box; text-decoration: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"></path><path d="M12 6v6M9 9h6"></path></svg><span style="font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.1">Событие на карту</span></a>
</div>
</div>
</sc-if>

<sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 96px">
<dc-import name="V3TabBar" active="map" plans="2" chats="3" hint-size="390px,96px"></dc-import>
</div>
</sc-if>

<sc-if value="{{isCoach}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden">
<span aria-hidden="true" style="position: absolute; left: {{coach.x}}px; top: 757px; width: 66px; height: 66px; border-radius: 50%; box-shadow: 0 0 0 1200px rgba(23,22,26,0.78); transition: left 320ms cubic-bezier(.2,.8,.2,1)"></span>
<span aria-hidden="true" style="position: absolute; left: {{coach.x}}px; top: 757px; width: 66px; height: 66px; border-radius: 50%; border: 2.5px solid #F0521F; box-sizing: border-box; transition: left 320ms cubic-bezier(.2,.8,.2,1)"></span>
<div class="v3up" style="position: absolute; left: 24px; right: 24px; top: 470px; padding: 20px; border-radius: 22px; background: #FBFAF6; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; gap: 6px"><sc-for list="{{coach.dots}}" as="d" hint-placeholder-count="4"><span style="width: {{d.w}}px; height: 6px; border-radius: 3px; background: {{d.bg}}"></span></sc-for></span>
<span style="display: flex; align-items: center; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 14px; background: #17161A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{coach.icon}}"></path></svg></span><span style="font-family: 'Geologica', sans-serif; font-size: 22px; font-weight: 700">{{coach.title}}</span></span>
<span style="font-size: 16px; line-height: 1.4; color: #3A3833">{{coach.text}}</span>
<div style="display: flex; gap: 8px; padding-top: 4px">
<button type="button" onClick="{{skipCoach}}" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 0; background: transparent; font-family: 'Golos Text', sans-serif; font-size: 15px; font-weight: 600; color: #55524C">Пропустить</button>
<button type="button" onClick="{{nextCoach}}" style="flex-grow: 1; height: 48px; border-radius: 14px; border: 0; background: #F0521F; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700; color: #17161A">{{coach.cta}}</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheet":{"editor":"enum","options":["none","pin","friend","filter","plus","coach"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: props.sheet ?? 'none', when: '24h', day: null, cats: {}, price: 'any', going: false, pill: null, step: 0, stickered: false };
    this.timer = null;
  }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  pill(text) {
    if (this.timer) clearTimeout(this.timer);
    this.setState({ pill: text });
    this.timer = setTimeout(() => this.setState({ pill: null }), 2600);
  }
  renderVals() {
    const s = this.state;
    const set = (p) => () => this.setState(p);
    const I = {
      music: 'M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z',
      mic: 'M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3',
      dice: 'M7 4h10a3 3 0 013 3v10a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3zM9 9h.01M15 15h.01M15 9h.01M9 15h.01',
      art: 'M12 3a9 9 0 100 18c1.1 0 1.5-.8 1.5-1.5 0-.9-.7-1.2-.7-2 0-.8.7-1.5 1.5-1.5H17a4 4 0 004-4c0-5-4-9-9-9zM7.5 11h.01M10.5 7h.01M15 7.5h.01',
      hike: 'M3 20l6-10 4 6 3-4 5 8z',
      food: 'M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17M8 3v2M12 3v2',
      sport: 'M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12',
      party: 'M5 21l4-12 7 7-11 5zM14 3l1 2M19 8l2-1M17 3l-1 3M20 12l-3 0',
      coffee: 'M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17',
      move: 'M3 11l18-8-8 18-2-8z',
      work: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16'
    };
    const pins = [
      { id: 'jazz', x: 196, y: 392, icon: I.music, hot: true, label: '19:30' },
      { id: 'standup', x: 104, y: 520, icon: I.mic, label: '20:00' },
      { id: 'games', x: 238, y: 540, icon: I.dice, label: '20:00' },
      { id: 'kut', x: 300, y: 246, icon: I.music, label: '18:00' },
      { id: 'anime', x: 84, y: 262, icon: I.art, label: '' },
      { id: 'quiz', x: 150, y: 196, icon: I.dice, label: '' }
    ].map((p) => {
      const sel = s.sheet === 'pin' && p.id === 'jazz';
      return {
        ...p,
        size: p.hot ? 40 : 34,
        bg: p.hot ? '#F0521F' : '#17161A',
        fg: p.hot ? '#17161A' : '#F3F0E8',
        shadow: sel ? '0 0 0 4px #FBFAF6, 0 0 0 6px #17161A' : '0 0 0 2px #FBFAF6, 0 4px 10px rgba(23,22,26,0.25)',
        showLabel: !!p.label,
        aria: 'Событие',
        select: set({ sheet: 'pin' })
      };
    });
    const friends = [
      { name: 'Игорь', x: 254, y: 352, photo: '../assets/igor.jpg', badge: I.coffee, badgeBg: '#C77A12' },
      { name: 'Денис', x: 334, y: 336, photo: '../assets/denis.jpg', badge: I.move, badgeBg: '#2447B8' },
      { name: 'Антон', x: 40, y: 286, photo: '../assets/anton.jpg', badge: I.art, badgeBg: '#17161A' },
      { name: 'Тимур', x: 290, y: 690, initial: 'Т', badge: I.hike, badgeBg: '#2F8F5B' }
    ].map((f) => ({ ...f, hasPhoto: !!f.photo, noPhoto: !f.photo, badgeFg: '#FBFAF6', aria: 'Друг ' + f.name, select: set({ sheet: 'friend' }) }));
    const whenDefs = [{ k: '24h', l: '24 часа' }, { k: 'today', l: 'Сегодня' }, { k: 'tomorrow', l: 'Завтра' }, { k: 'weekend', l: 'Выходные' }];
    const whens = whenDefs.map((w) => {
      const on = s.when === w.k;
      return { label: w.l, bg: on ? '#17161A' : '#FBFAF6', fg: on ? '#F3F0E8' : '#17161A', border: on ? '#17161A' : '#CFC9BB', pick: set({ when: w.k, day: null }) };
    });
    const wds = ['ЧТ', 'ПТ', 'СБ', 'ВС', 'ПН', 'ВТ', 'СР'];
    const days = [];
    for (let i = 0; i < 14; i++) {
      const n = i + 1;
      const inWeekend = s.when === 'weekend' && (n === 3 || n === 4);
      const on = s.day === n || inWeekend || (s.when === 'today' && n === 1) || (s.when === 'tomorrow' && n === 2) || (s.when === '24h' && (n === 1 || n === 2) && !s.day);
      const soft = s.when === '24h' && !s.day && (n === 1 || n === 2);
      days.push({ wd: wds[i % 7], n: String(n), bg: on ? (soft ? '#EADFB8' : '#17161A') : '#F3F0E8', fg: on && !soft ? '#F3F0E8' : '#17161A', pick: set({ day: n, when: 'day' }) });
    }
    const catDefs = [
      ['music', 'Музыка', I.music], ['mic', 'Смех', I.mic], ['hike', 'Горы', I.hike], ['sport', 'Спорт', I.sport],
      ['dice', 'Игры', I.dice], ['art', 'Искусство', I.art], ['food', 'Еда', I.food], ['party', 'Тусовки', I.party]
    ];
    const cats = catDefs.map(([k, l, ic]) => {
      const on = !!s.cats[k];
      return { label: l, icon: ic, bg: on ? '#17161A' : '#F3F0E8', fg: on ? '#F3F0E8' : '#17161A', toggle: () => this.setState({ cats: { ...s.cats, [k]: !on } }) };
    });
    const prices = [{ k: 'any', l: 'Любая' }, { k: 'free', l: 'Бесплатно' }, { k: 'cheap', l: 'до 5 000' }].map((o) => ({
      label: o.l, bg: o.k === s.price ? '#FBFAF6' : 'transparent', shadow: o.k === s.price ? '0 1px 3px rgba(23,22,26,0.18)' : 'none', pick: set({ price: o.k })
    }));
    const nCats = Object.values(s.cats).filter(Boolean).length;
    const whenLabel = s.day ? (wds[(s.day - 1) % 7].charAt(0) + wds[(s.day - 1) % 7].slice(1).toLowerCase() + ', ' + s.day + ' окт') : ({ '24h': '24 часа', today: 'Сегодня', tomorrow: 'Завтра', weekend: 'Выходные' }[s.when] || '24 часа');
    const count = s.when === '24h' && !s.day ? 14 : (s.when === 'weekend' ? 23 : 9);
    const coachSteps = [
      { x: 20, title: 'Карта', text: 'Всё, что будет в ближайшие сутки. Друзья — тоже здесь', icon: I.music.length ? 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15' : '' },
      { x: 92, title: 'Подборка', text: 'Листай карточки: вправо — пойду, влево — мимо', icon: 'M8.5 3h9.5a2.5 2.5 0 012.5 2.5v10a2.5 2.5 0 01-2.5 2.5h-7a2.5 2.5 0 01-2.5-2.5zM5 7.5v10.5a3 3 0 003 3h8' },
      { x: 164, title: 'Планы', text: 'Куда идёшь и куда тебя зовут', icon: 'M6 4.5h12a3 3 0 013 3v10.5a3 3 0 01-3 3H6a3 3 0 01-3-3V7.5a3 3 0 013-3zM3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.3 2.3 4.7-4.6' },
      { x: 236, title: 'Чаты', text: 'Друзья сверху, переписки ниже', icon: 'M4 5h16v11H9l-5 4z' }
    ];
    const st = coachSteps[Math.min(s.step, 3)];
    const coach = {
      ...st,
      cta: s.step >= 3 ? 'Понятно' : 'Дальше',
      dots: coachSteps.map((_, i) => ({ w: i === s.step ? 22 : 6, bg: i === s.step ? '#F0521F' : '#CFC9BB' }))
    };
    const sheet = s.sheet;
    return {
      pins, friends, whens, days, cats, prices, coach,
      whenLabel,
      filterOn: s.when !== '24h' || nCats > 0 || s.price !== 'any',
      showCta: 'Показать ' + count,
      isPin: sheet === 'pin',
      isFriend: sheet === 'friend',
      isFilter: sheet === 'filter',
      isPlus: sheet === 'plus',
      isCoach: sheet === 'coach',
      hasModal: sheet === 'filter' || sheet === 'plus',
      showTabs: sheet !== 'filter' && sheet !== 'plus',
      going: s.going,
      notGoing: !s.going,
      showPill: !!s.pill,
      pillText: s.pill || '',
      stickerLabel: s.stickered ? 'Улетел' : 'Стикер',
      go: () => { this.setState({ going: true }); this.pill('✓ В Планах'); },
      sticker: () => { this.setState({ stickered: true }); this.pill('«Го?» улетел Игорю'); },
      openFilter: set({ sheet: 'filter' }),
      openPlus: set({ sheet: 'plus' }),
      close: set({ sheet: 'none' }),
      reset: set({ when: '24h', day: null, cats: {}, price: 'any' }),
      nextCoach: () => (s.step >= 3 ? this.setState({ sheet: 'none' }) : this.setState({ step: s.step + 1 })),
      skipCoach: set({ sheet: 'none' })
    };
  }
}
</script>
</body>
</html>
