<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта v3: день и погода одним чипсом</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3Up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v3Pulse{0%{transform:scale(0.6);opacity:0.6}100%{transform:scale(2.4);opacity:0}}
@keyframes v3Pill{0%{transform:translateY(-12px);opacity:0}15%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes v3Drop{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v3LeafA{0%{transform:translate(0,-60px) rotate(0deg)}50%{transform:translate(46px,400px) rotate(260deg)}100%{transform:translate(-10px,900px) rotate(540deg)}}
@keyframes v3LeafB{0%{transform:translate(0,-60px) rotate(0deg)}50%{transform:translate(-40px,420px) rotate(-220deg)}100%{transform:translate(30px,900px) rotate(-480deg)}}
@keyframes v3Snow{0%{transform:translate(0,-30px)}50%{transform:translate(14px,420px)}100%{transform:translate(-8px,880px)}}
@keyframes v3Rain{from{transform:translate(0,-40px) rotate(14deg)}to{transform:translate(-200px,880px) rotate(14deg)}}
@keyframes v3PinIn{0%{transform:translateY(-10px) scale(0.6)}100%{transform:translateY(0) scale(1)}}
@keyframes v3Bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.v3up{animation:v3Up 260ms cubic-bezier(.2,.8,.2,1) both}
.v3drop{animation:v3Drop 240ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEBE2; font-family: 'Golos Text', sans-serif; color: #17161A">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="MapBase" theme="paper" hint-size="390px,844px"></dc-import>
</div>
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{tint}}; transition: background 500ms ease; pointer-events: none"></span>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; pointer-events: none">
<sc-for list="{{particles}}" as="q" hint-placeholder-count="12">
<span style="position: absolute; left: {{q.x}}px; top: 0; width: {{q.w}}px; height: {{q.h}}px; border-radius: {{q.r}}; background: {{q.bg}}; box-shadow: {{q.shadow}}; opacity: {{q.op}}; animation: {{q.anim}} {{q.dur}}s linear {{q.delay}}s infinite"><sc-if value="{{q.leaf}}" hint-placeholder-val="{{ false }}"><svg width="{{q.w}}" height="{{q.h}}" viewBox="0 0 24 24" style="display: block"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z" fill="{{q.fill}}"></path><path d="M4 20L15 9" stroke="rgba(23,22,26,0.35)" stroke-width="1.2" fill="none"></path></svg></sc-if></span>
</sc-for>
</div>

<sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.select}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 4px; cursor: pointer; opacity: {{p.op}}; transition: opacity 240ms ease; animation: v3PinIn 320ms cubic-bezier(.2,.8,.2,1) {{p.delay}}ms both">
<span style="position: relative; width: {{p.size}}px; height: {{p.size}}px; border-radius: 12px; background: {{p.bg}}; box-shadow: {{p.shadow}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
<sc-if value="{{p.hasWho}}" hint-placeholder-val="{{ false }}"><img src="{{p.who}}" alt="" style="position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 2px solid #2447B8; box-sizing: border-box; box-shadow: 0 0 0 2px #FBFAF6"></sc-if>
</span>
<sc-if value="{{p.showLabel}}" hint-placeholder-val="{{ true }}"><span style="padding: 3px 7px; border-radius: 8px; background: #17161A; color: #F3F0E8; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; white-space: nowrap">{{p.label}}</span></sc-if>
</button>
</sc-for>

<sc-if value="{{isNow}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; left: 335px; top: 318px; width: 5px; height: 5px; border-radius: 50%; background: #2447B8; opacity: 0.25"></span>
<span aria-hidden="true" style="position: absolute; left: 326px; top: 328px; width: 6px; height: 6px; border-radius: 50%; background: #2447B8; opacity: 0.45"></span>
<sc-for list="{{friends}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.select}}" aria-label="{{f.aria}}" style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
<img src="{{f.photo}}" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box; box-shadow: 0 0 0 2px #FBFAF6, 0 4px 10px rgba(23,22,26,0.25); display: block">
<span style="position: absolute; right: -2px; bottom: 0; width: 22px; height: 22px; border-radius: 50%; background: {{f.badgeBg}}; box-shadow: 0 0 0 2px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.badge}}"></path></svg></span>
</button>
</sc-for>
</sc-if>

<span aria-hidden="true" style="position: absolute; left: 168px; top: 466px; width: 24px; height: 24px; border-radius: 50%; background: rgba(36,71,184,0.25); animation: v3Pulse 2s ease-out infinite"></span>
<span aria-label="Я здесь" style="position: absolute; left: 172px; top: 470px; width: 16px; height: 16px; border-radius: 50%; background: #2447B8; box-shadow: 0 0 0 3px #FBFAF6, 0 2px 6px rgba(23,22,26,0.3)"></span>

<sc-if value="{{isPoint}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0; pointer-events: none"><path d="M186 482L292 514M278 392L298 510" stroke="#2447B8" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" fill="none" opacity="0.6"></path></svg>
<div style="position: absolute; left: 254px; top: 430px; display: flex; flex-direction: column; align-items: center; animation: v3Bounce 1.4s ease-in-out infinite; z-index: 3">
<span style="padding: 5px 10px; border-radius: 10px; background: #17161A; color: #F3F0E8; font-size: 13px; font-weight: 700; white-space: nowrap; margin-bottom: 4px">Тут · {{pointTime}}</span>
<svg width="44" height="54" viewBox="0 0 44 54" aria-hidden="true"><path d="M22 52S4 33 4 20a18 18 0 0136 0c0 13-18 32-18 32z" fill="#F0521F" stroke="#FBFAF6" stroke-width="3"></path><circle cx="22" cy="20" r="7" fill="#17161A"></circle></svg>
</div>
<span aria-hidden="true" style="position: absolute; left: 290px; top: 516px; width: 20px; height: 8px; border-radius: 50%; background: rgba(23,22,26,0.25)"></span>
</sc-if>

<div style="position: absolute; left: 16px; right: 16px; top: 52px; display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 48px; border-radius: 24px; border: 1px solid rgba(23,22,26,0.08); background: rgba(251,250,246,0.95); box-shadow: 0 4px 14px rgba(23,22,26,0.12); display: flex; align-items: center; gap: 10px; padding: 0 16px; font-family: 'Golos Text', sans-serif; font-size: 15px; color: #55524C; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Поиск</button>
<button type="button" onClick="{{openFilter}}" aria-label="Фильтр" style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(23,22,26,0.08); background: rgba(251,250,246,0.95); box-shadow: 0 4px 14px rgba(23,22,26,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg><sc-if value="{{filterOn}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: #F0521F; box-shadow: 0 0 0 2px #FBFAF6"></span></sc-if></button>
<button type="button" onClick="{{openPlus}}" aria-label="Создать" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 0; background: #17161A; box-shadow: 0 4px 14px rgba(23,22,26,0.2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<button type="button" onClick="{{toggleDays}}" aria-label="Выбрать день" aria-expanded="{{daysOpen}}" style="position: absolute; left: 16px; top: 108px; height: 36px; padding: 0 10px 0 8px; border-radius: 18px; border: 0; background: {{chipBg}}; color: {{chipFg}}; box-shadow: 0 4px 12px rgba(23,22,26,0.14); display: flex; align-items: center; gap: 7px; font-family: 'Golos Text', sans-serif; font-size: 14px; font-weight: 600">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{dayIconColor}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{dayIcon}}"></path></svg></span>
{{chipLabel}}
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chev}}deg); transition: transform 200ms ease"><path d="M6 9l6 6 6-6"></path></svg>
</button>

<sc-if value="{{isDays}}" hint-placeholder-val="{{ false }}">
<div class="v3drop" style="position: absolute; left: 10px; right: 10px; top: 152px; padding: 8px; border-radius: 22px; background: rgba(251,250,246,0.97); box-shadow: 0 10px 28px rgba(23,22,26,0.18); display: flex; gap: 6px; overflow-x: auto">
<sc-for list="{{dayList}}" as="d" hint-placeholder-count="14">
<button type="button" onClick="{{d.pick}}" aria-label="{{d.aria}}" style="width: {{d.w}}px; height: 92px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 0; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Golos Text', sans-serif">
<span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{d.wd}}</span>
<span style="font-family: 'Geologica', sans-serif; font-size: 17px; font-weight: 700; line-height: 1">{{d.n}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{d.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600">{{d.t}}</span>
</button>
</sc-for>
</div>
</sc-if>

<button type="button" aria-label="Где я" style="position: absolute; right: 16px; top: 640px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(23,22,26,0.08); background: rgba(251,250,246,0.95); box-shadow: 0 4px 14px rgba(23,22,26,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg></button>

<sc-if value="{{isPin}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 12px; right: 12px; bottom: 104px; box-sizing: border-box; padding: 12px; border-radius: 22px; background: #FBFAF6; box-shadow: 0 10px 28px rgba(23,22,26,0.2); display: flex; flex-direction: column; gap: 12px">
<a href="V3Event.dc.html" style="display: flex; gap: 12px; align-items: center; text-decoration: none; color: #17161A">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #F0521F; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
<span style="font-family: 'Geologica', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.1">Джаз во дворе</span>
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; color: #3A3833">19:30 · 0 ₸<span style="display: flex; align-items: center; gap: 3px; padding: 2px 7px 2px 5px; border-radius: 9px; background: #E7E2D6; color: #17161A"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4.5a1.5 1.5 0 110 .01M10 21l2-6 3 3v3M9 12l2-3.5 3 1 2 3.5M11 8.5L8 10l-1 3"></path></svg>12 мин</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span style="display: flex"><img src="../assets/igor.jpg" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 2px solid #2447B8; box-sizing: border-box"><img src="../assets/denis.jpg" alt="" style="width: 24px; height: 24px; margin-left: -7px; border-radius: 50%; object-fit: cover; border: 2px solid #2447B8; box-sizing: border-box"><img src="../assets/mira.jpg" alt="" style="width: 24px; height: 24px; margin-left: -7px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6; box-sizing: border-box"></span><span style="font-size: 13px; font-weight: 600; color: #3A3833">+35</span></span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<sc-if value="{{notGoing}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{go}}" style="height: 50px; border-radius: 14px; border: 0; background: #F0521F; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700; color: #17161A">Пойду</button>
</sc-if>
<sc-if value="{{going}}" hint-placeholder-val="{{ false }}">
<a href="V3Plans.dc.html" style="height: 50px; border-radius: 14px; background: #D9E4D2; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; color: #17161A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Иду · в Планах</a>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isFriend}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 12px; right: 12px; bottom: 104px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #FBFAF6; box-shadow: 0 10px 28px rgba(23,22,26,0.2); display: flex; flex-direction: column; gap: 14px">
<a href="V3PersonFriend.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #17161A">
<span style="position: relative; width: 56px; height: 56px; flex-shrink: 0"><img src="../assets/igor.jpg" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box"><span style="position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: #C77A12; box-shadow: 0 0 0 2px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-family: 'Geologica', sans-serif; font-size: 20px; font-weight: 700">Игорь</span><span style="font-size: 14px; color: #3A3833">Кофейня Saya · 6 мин</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{friendActions}}" as="a" hint-placeholder-count="3">
<a href="{{a.href}}" onClick="{{a.tap}}" style="height: 64px; border-radius: 16px; background: {{a.bg}}; color: {{a.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>{{a.label}}</a>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isPoint}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 12px; right: 12px; bottom: 104px; box-sizing: border-box; padding: 12px; border-radius: 22px; background: #FBFAF6; box-shadow: 0 10px 28px rgba(23,22,26,0.2); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/tower.jpg" alt="Место встречи" style="width: 58px; height: 58px; border-radius: 14px; object-fit: cover; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Urbo Coffee</span><span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #3A3833"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A3833" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4.5a1.5 1.5 0 110 .01M10 21l2-6 3 3v3M9 12l2-3.5 3 1 2 3.5M11 8.5L8 10l-1 3"></path></svg>тебе 8 мин · Игорю 5 мин</span></span>
<img src="../assets/igor.jpg" alt="Игорь" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2.5px solid #2447B8; box-sizing: border-box">
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{times}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="height: 40px; border-radius: 12px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 600">{{t.label}}</button>
</sc-for>
</div>
<button type="button" onClick="{{sendPoint}}" style="height: 50px; border-radius: 14px; border: 0; background: {{sendBg}}; color: {{sendFg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sendIcon}}"></path></svg>{{sendLabel}}</button>
</div>
</sc-if>

<sc-if value="{{showPill}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 156px; transform: translateX(-50%); padding: 8px 14px; border-radius: 18px; background: #17161A; color: #F3F0E8; font-size: 14px; font-weight: 600; white-space: nowrap; animation: v3Pill 2.6s ease both; z-index: 9">{{pillText}}</div>
</sc-if>

<sc-if value="{{hasModal}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{close}}" aria-label="Закрыть" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; background: rgba(23,22,26,0.34)"></button>
</sc-if>

<sc-if value="{{isFilter}}" hint-placeholder-val="{{ false }}">
<div class="v3up" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 28px; border-radius: 24px 24px 0 0; background: #FBFAF6; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFC9BB"></span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="8">
<button type="button" onClick="{{k.toggle}}" aria-pressed="{{k.pressed}}" style="height: 70px; border-radius: 16px; border: 0; background: {{k.bg}}; color: {{k.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-family: 'Golos Text', sans-serif; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg>{{k.label}}</button>
</sc-for>
</div>
<sc-for list="{{segments}}" as="g" hint-placeholder-count="2">

      ],
      sendLabel: s.sent ? 'Улетело Игорю' : 'Отправить Игорю',
      sendIcon: s.sent ? I.check : I.send,
      sendBg: s.sent ? '#D9E4D2' : '#F0521F',
      sendFg: '#17161A',
      sendPoint: () => { this.setState({ sent: true }); this.pill('Точка у Игоря в чате'); },
      plusPoint: set({ sheet: 'point', sent: false }),
      toggleDays: () => this.setState({ sheet: daysOpen ? 'none' : 'days' }),
      go: () => { this.setState({ going: true }); this.pill('В Планах'); },
      openFilter: set({ sheet: 'filter' }),
      openPlus: set({ sheet: 'plus' }),
      close: set({ sheet: 'none' }),
      reset: set({ cats: {}, price: 'any', order: 'you' }),
      nextCoach: () => (s.step >= last ? this.setState({ sheet: 'none' }) : this.setState({ step: s.step + 1 })),
      skipCoach: set({ sheet: 'none' })
    };
  }
}
</script>
</body>
</html>
