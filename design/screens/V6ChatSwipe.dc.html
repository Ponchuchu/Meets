<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чаты: смахнуть влево — удалить</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v6csRowL{0%,8%{transform:translateX(0)}17%,33%{transform:translateX(-222px)}36%,100%{transform:translateX(-222px)}}
@keyframes v6csCollapse{0%,49%{height:76px;opacity:1}50%{opacity:0.4}56%,90%{height:0;opacity:0}96%,100%{height:76px;opacity:1}}
@keyframes v6csRowR{0%,62%{transform:translateX(0)}69%,72%{transform:translateX(96px)}77%,100%{transform:translateX(0)}}
@keyframes v6csReadAct{0%,62%{opacity:0}66%,74%{opacity:1}78%,100%{opacity:0}}
@keyframes v6csReadIcon{0%,68%{transform:scale(0.6)}70%{transform:scale(1.25)}72%,100%{transform:scale(1)}}
@keyframes v6csBadge{0%,72%{transform:scale(1);opacity:1}76%,94%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes v6csSheet{0%,36%{transform:translateY(420px)}41%,46%{transform:translateY(0)}51%,100%{transform:translateY(420px)}}
@keyframes v6csDim{0%,36%{opacity:0}41%,46%{opacity:1}51%,100%{opacity:0}}
@keyframes v6csToast{0%,52%{transform:translateY(240px)}56%,84%{transform:translateY(0)}88%,100%{transform:translateY(240px)}}
@keyframes v6csCount{0%,56%{stroke-dashoffset:0}84%,100%{stroke-dashoffset:63}}
@keyframes v6csFinger{0%,6%{left:330px;top:424px;opacity:0}8%{opacity:1;left:330px}17%{left:108px;opacity:1}19%{opacity:0;left:108px;top:424px}29%{opacity:0;left:350px;top:424px}31%{opacity:1;left:350px;top:424px;transform:scale(1)}33%{transform:scale(0.8);top:424px}35%{transform:scale(1);opacity:1;top:424px}37%{opacity:0;top:424px}42%{opacity:0;left:195px;top:668px}43%{opacity:1;left:195px;top:668px;transform:scale(1)}45%{transform:scale(0.8)}47%{transform:scale(1);opacity:1}49%{opacity:0;left:195px;top:668px}61%{opacity:0;left:60px;top:272px}63%{opacity:1;left:60px;top:272px}70%{left:156px;opacity:1;top:272px}72%,100%{opacity:0;left:156px;top:272px}}
@keyframes v6tbFill{0%{fill:rgba(23,22,26,0);stroke:#5F5B55}100%{fill:#17161A;stroke:#17161A}}
@keyframes v6tbDet{0%{stroke:#5F5B55}100%{stroke:#FBFAF6}}
@keyframes v6tbPop{0%{transform:scale(0.84)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes v6tbRing{0%{border-color:transparent;transform:scale(0.84)}55%{transform:scale(1.1)}100%{border-color:#17161A;transform:scale(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="padding: 58px 20px 0; font-family: 'Geologica', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">Чаты</div>
<div style="margin: 12px 20px 8px; height: 42px; border-radius: 14px; background: #E7E2D6; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #6B665E; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 110 14 7 7 0 010-14zM20 20l-4-4"></path></svg>Поиск</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="position: relative; height: 76px; overflow: hidden; animation: {{r.wrap}} 10s cubic-bezier(.4,0,.2,1) infinite">
<sc-if value="{{r.del}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 0; top: 0; height: 76px; display: flex">
<sc-for list="{{acts}}" as="a" hint-placeholder-count="3"><span style="width: 74px; height: 76px; background: {{a.bg}}; color: #FBFAF6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.i}}"></path></svg>{{a.t}}</span></sc-for>
</div>
</sc-if>
<sc-if value="{{r.read}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 96px; height: 76px; background: #2447B8; color: #FBFAF6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 600; animation: v6csReadAct 10s ease infinite"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: v6csReadIcon 10s ease infinite"><path d="M2 12.5l4 4L14 8.5M10 16.5l1 1 9-9"></path></svg>Прочитано</div>
</sc-if>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 76px; box-sizing: border-box; padding: 0 20px; background: #F3F0E8; display: flex; align-items: center; gap: 12px; animation: {{r.anim}} 10s cubic-bezier(.3,0,.2,1) infinite">
<sc-if value="{{r.photo}}" hint-placeholder-val="{{ true }}"><img src="{{r.p}}" alt="" style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex-shrink: 0"></sc-if>
<sc-if value="{{r.group}}" hint-placeholder-val="{{ false }}"><span style="width: 54px; height: 54px; border-radius: 18px; flex-shrink: 0; background: #F0521F; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M6 21a3 3 0 100-6 3 3 0 000 6zM18 19a3 3 0 100-6 3 3 0 000 6z"></path></svg></span></sc-if>
<div style="flex: 1; min-width: 0; border-bottom: 1px solid #E4DFD3; height: 76px; display: flex; flex-direction: column; justify-content: center">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16.5px; font-weight: 700">{{r.n}}</span><span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B665E"><sc-if value="{{r.mine}}" hint-placeholder-val="{{ false }}"><svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="#2F8F5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6.5l3.2 3.2L11 2.5M7.5 9.2l.5.5L15 2.5"></path></svg></sc-if>{{r.t}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 3px"><span style="font-size: 14.5px; color: #5F5B55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.m}}</span><sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #F0521F; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; animation: {{r.badgeAnim}} 10s cubic-bezier(.3,1.5,.5,1) infinite">{{r.b}}</span></sc-if></div>
</div>
</div>
</div>
</sc-for>
<div style="position: absolute; left: 0; bottom: 0"><dc-import name="V6TabBar" active="chats" plans="2" chats="3" hint-size="390px,96px"></dc-import></div>

<div style="position: absolute; inset: 0; background: rgba(23,22,26,0.4); animation: v6csDim 10s ease infinite"></div>
<div style="position: absolute; left: 10px; right: 10px; bottom: 26px; animation: v6csSheet 10s cubic-bezier(.2,.8,.2,1) infinite">
<div style="border-radius: 22px; background: #FBFAF6; overflow: hidden; text-align: center">
<div style="padding: 18px 20px 14px; font-size: 14px; color: #5F5B55; line-height: 1.4">Удалить чат с Ерланом?</div>
<div style="height: 56px; border-top: 1px solid #E4DFD3; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #C2321F">Удалить у меня</div>
<div style="height: 56px; border-top: 1px solid #E4DFD3; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #C2321F">Удалить у меня и у Ерлана</div>
</div>
<div style="margin-top: 8px; height: 56px; border-radius: 18px; background: #FBFAF6; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Отмена</div>
</div>
<div style="position: absolute; left: 14px; right: 14px; bottom: 104px; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; background: #17161A; color: #F3F0E8; display: flex; align-items: center; gap: 12px; animation: v6csToast 10s cubic-bezier(.2,.8,.2,1) infinite">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#3A383F" stroke-width="3"></circle><circle cx="13" cy="13" r="10" fill="none" stroke="#F7B08A" stroke-width="3" stroke-dasharray="63" transform="rotate(-90 13 13)" style="animation: v6csCount 10s linear infinite"></circle></svg>
<span style="flex: 1; font-size: 15px; font-weight: 600">Чат удалён</span>
<span style="font-size: 15px; font-weight: 700; color: #F7B08A">Вернуть</span>
</div>
<span aria-hidden="true" style="position: absolute; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(23,22,26,0.22); border: 4px solid rgba(251,250,246,0.95); box-sizing: border-box; z-index: 9; animation: v6csFinger 10s cubic-bezier(.4,0,.2,1) infinite"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['../assets/igor.jpg', 'Игорь', 'Стикер', '21:14', 2, false, ''],
      ['../assets/arman.jpg', 'Арман', 'Ты где? Мы уже тут', '21:02', 3, false, 'read'],
      ['', 'Открытый микрофон', 'Тимур: я записался!', '20:40', 0, false, 'group'],
      ['../assets/erlan.jpg', 'Ерлан', 'Ок, тогда в субботу', '19:30', 0, true, 'del'],
      ['../assets/kamila.jpg', 'Камила', 'Фото с похода скину', '18:12', 0, true, ''],
      ['../assets/timur.jpg', 'Тимур', 'Точка: я тут', 'вчера', 0, false, ''],
      ['../assets/daniel.jpg', 'Даниэль', 'Спокойной ночи', 'вчера', 0, true, '']
    ];
    return {
      fy: '403', fy2: '279',
      acts: [['#8F897C', 'Без звука', 'M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6'], ['#2447B8', 'Закрепить', 'M12 17v5M9 3h6l-1 6 4 4H6l4-4z'], ['#C2321F', 'Удалить', 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3']].map(([bg, t, i]) => ({ bg, t, i })),
      rows: R.map(([p, n, m, t, b, mine, kind]) => ({ p, n, m, t, b: String(b), hasBadge: b > 0, mine, photo: kind !== 'group', group: kind === 'group', del: kind === 'del', read: kind === 'read', anim: kind === 'del' ? 'v6csRowL' : kind === 'read' ? 'v6csRowR' : 'none', wrap: kind === 'del' ? 'v6csCollapse' : 'none', badgeAnim: kind === 'read' ? 'v6csBadge' : 'none' }))
    };
  }
}
</script>
</body>
</html>
