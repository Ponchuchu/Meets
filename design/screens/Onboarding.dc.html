<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Регистрация: что вытаскивает из дома</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
a{color:#17161A}a:hover{color:#17161A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A; padding: 56px 20px 30px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="SignUpProfile.dc.html" aria-label="Назад" style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border: 1px solid #DDD8CC; border-radius: 50%; background: #FBFAF6; display: flex; align-items: center; justify-content: center; color: #17161A; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em">2 / 3</span>
<span style="flex-grow: 1; display: flex; gap: 4px"><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #17161A"></span><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #17161A"></span><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #D6D0C3"></span></span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Geologica', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05">Что вытаскивает тебя из дома?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #55524C">С этого начнётся «Для тебя». Дальше подборка подстроится под твои свайпы сама.</p>
</div>

<div role="group" aria-label="Что вытаскивает из дома" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="10">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 74px; box-sizing: border-box; padding: 12px 14px; border: 1px solid {{o.border}}; border-radius: 18px; background: {{o.bg}}; color: {{o.fg}}; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; font-family: 'Golos Text', sans-serif; font-size: 14.5px; font-weight: 600; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>{{o.label}}</button>
</sc-for>
</div>

<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: {{countFg}}">{{countLabel}}</span>

<span style="flex-grow: 1"></span>

<a href="SignUpRhythm.dc.html" style="height: 56px; border-radius: 16px; background: {{nextBg}}; color: {{nextFg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Дальше</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { music: true, games: true, hike: true } };
  }
  renderVals() {
    const s = this.state;
    const INK = '#17161A';
    const defs = [
      ['music', 'Живая музыка', 'M9 18V5l11-2v13M6 21a3 3 0 100-6 3 3 0 000 6zM17 19a3 3 0 100-6 3 3 0 000 6z'],
      ['standup', 'Посмеяться', 'M9 3h6v11H9zM5 11a7 7 0 0014 0M12 18v3'],
      ['hike', 'Горы и природа', 'M3 20l6-10 4 6 3-4 5 8z'],
      ['sport', 'Бег и вело', 'M5.5 20.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM18.5 20.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM5.5 17L9 9h6l3.5 8M9 9L7.5 6H5.5'],
      ['people', 'Новые люди', 'M9 11.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2'],
      ['games', 'Настолки', 'M4 4h16v16H4zM9 9h.01M15 15h.01M15 9h.01M9 15h.01'],
      ['art', 'Выставки', 'M12 3l2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7z'],
      ['food', 'Еда и маркеты', 'M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17'],
      ['party', 'Вечеринки', 'M4 20l5-14 9 9zM14 4l1 2M19 7l2-1M18 3l-1 2'],
      ['talks', 'Лекции и кино', 'M4 5h16v14H4zM8 5v14M16 5v14M4 9h4M4 15h4M16 9h4M16 15h4']
    ];
    const n = Object.values(s.on).filter(Boolean).length;
    const opts = defs.map(([k, label, icon]) => {
      const on = !!s.on[k];
      return { label, icon, on, bg: on ? INK : '#FBFAF6', fg: on ? '#F3F0E8' : INK, border: on ? INK : '#CFC9BB', pick: () => this.setState({ on: { ...s.on, [k]: !on } }) };
    });
    const ok = n >= 3;
    return {
      opts,
      countLabel: ok ? 'ВЫБРАНО ' + n + ' · МОЖНО СКОЛЬКО УГОДНО' : 'ВЫБЕРИ ХОТЯ БЫ 3 · СЕЙЧАС ' + n,
      countFg: ok ? '#55524C' : '#8A3A12',
      nextBg: ok ? INK : '#E7E2D6', nextFg: ok ? '#F3F0E8' : '#6B675F'
    };
  }
}
</script>
</body>
</html>
