class Component extends DCLogic {

  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const S = [{"t": "Запуск", "g": "запуск", "c": "«рядом» пишется кистью, точка встаёт туда, где ты. Карта раскрывается из неё и приближается, чтобы ты был в центре."}, {"t": "Привет", "g": "вход", "c": "Первый экран: войти по номеру, через Apple или Google. Можно сначала просто посмотреть карту."}, {"t": "Номер", "g": "вход", "c": "Номер +7 747 446 07 49 уже есть в демо-базе."}, {"t": "Код", "g": "вход", "c": "В демо код всегда 0000. В настоящем приложении придёт SMS."}, {"t": "Это ты?", "g": "вход", "c": "Нашли в базе — имя и роль уже заполнены."}, {"t": "Интересы", "g": "вход", "c": "С них стартуют Рекомендации. Потом лента учится на свайпах."}, {"t": "Разрешения", "g": "вход", "c": "Геолокация и уведомления — объясняем зачем, одной строкой."}, {"t": "Добро пожаловать", "g": "вход", "c": "«добро пожаловать, Данил» пишется от руки — и сразу обучение."}, {"t": "Карта", "g": "обучение", "c": "Подсветка поверх настоящего экрана: что такое точки событий."}, {"t": "Поиск и фильтры", "g": "обучение", "c": "Сверху — поиск, слои, фильтры и «+». Дата — в фильтрах."}, {"t": "Слои", "g": "обучение", "c": "Обычная, пробки, «Где я был»."}, {"t": "Друзья", "g": "обучение", "c": "Кто тебя видит — только друзья."}, {"t": "Открой Рекомендации", "g": "обучение", "c": "Подсказка просит нажать вкладку — и экран меняется."}, {"t": "Смахивай", "g": "обучение", "c": "Тут карточка сама показывает: вправо, влево, вверх."}, {"t": "Планы", "g": "обучение", "c": "Вкладка «Планы»: куда идёшь и куда зовут."}, {"t": "Чаты", "g": "обучение", "c": "Вкладка «Чаты»: друзья, компании, стикеры, «я тут»."}, {"t": "Профиль", "g": "обучение", "c": "Места, приватность, невидимка, настройки."}, {"t": "Готово", "g": "обучение", "c": "Больше подсказок не будет."}];
    const i = this.state.i;
    const out = { list: S.map((s, k) => ({ n: String(k + 1).padStart(2, '0'), t: s.t, g: s.g, bg: k === i ? '#17161A' : '#FBFAF6', fg: k === i ? '#F3F0E8' : '#17161A', go: () => this.setState({ i: k, play: false }) })) };
    S.forEach((s, k) => { out['on' + k] = k === i; });
    return Object.assign(out, {
      cur: S[i], counter: 'ШАГ ' + String(i + 1).padStart(2, '0') + ' ИЗ 18', pct: String(Math.round((i + 1) / 18 * 100)),
      playLabel: this.state.play ? 'Пауза' : 'Смотреть само',
      prev: () => this.setState({ i: (i + 17) % 18, play: false }), next: () => this.setState({ i: (i + 1) % 18, play: false }), toggle: () => this.setState({ play: !this.state.play })
    });
  }
}
</script>
