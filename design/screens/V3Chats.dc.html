<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чаты v3: друзья сверху, переписки ниже</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3Up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.v3up{animation:v3Up 260ms cubic-bezier(.2,.8,.2,1) both}
@keyframes v3Spot{0%,100%{box-shadow:0 0 0 0 rgba(240,82,31,0.55)}50%{box-shadow:0 0 0 8px rgba(240,82,31,0)}}
@keyframes v3Swipe{0%{transform:translate(0,0) rotate(0deg);opacity:0}15%{opacity:1}70%{transform:translate(150px,-14px) rotate(14deg);opacity:1}100%{transform:translate(170px,-16px) rotate(16deg);opacity:0}}
@keyframes v3HintIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.v3hint{animation:v3HintIn 300ms cubic-bezier(.2,.8,.2,1) 120ms both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; padding: 52px 0 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
<h1 style="margin: 0; font-family: 'Geologica', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Чаты</h1>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Поиск" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #DDD8CC; background: #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button type="button" aria-label="Новый чат" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #17161A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></button>
</div>
</div>

<div style="display: flex; gap: 12px; padding: 2px 16px 6px; overflow-x: auto; flex-shrink: 0">
<a href="V3FindPeople.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 9px; width: 64px; flex-shrink: 0; text-decoration: none; color: #17161A">
<span style="width: 62px; height: 62px; border-radius: 50%; border: 2px dashed #B9B2A3; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 12.5px; font-weight: 600">Найти</span>
</a>
<sc-for list="{{friends}}" as="f" hint-placeholder-count="5">
<button type="button" onClick="{{f.open}}" style="display: flex; flex-direction: column; align-items: center; gap: 9px; width: 64px; flex-shrink: 0; border: 0; background: transparent; padding: 0; font-family: 'Golos Text', sans-serif; color: #17161A">
<span style="position: relative; width: 62px; height: 62px">
<sc-if value="{{f.hasPhoto}}" hint-placeholder-val="{{ true }}"><img src="{{f.photo}}" alt="" style="width: 62px; height: 62px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box; display: block"></sc-if>
<sc-if value="{{f.noPhoto}}" hint-placeholder-val="{{ false }}"><span style="width: 62px; height: 62px; border-radius: 50%; background: #D9E4D2; border: 3px solid #2447B8; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">{{f.initial}}</span></sc-if>
<sc-if value="{{f.hasBadge}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; right: -2px; bottom: -1px; width: 24px; height: 24px; border-radius: 50%; background: {{f.badgeBg}}; box-shadow: 0 0 0 2.5px #F3F0E8; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.badge}}"></path></svg></span></sc-if>
</span>
<span style="font-size: 12.5px; font-weight: 600">{{f.name}}</span>
</button>
</sc-for>
</div>

<a href="V3Requests.dc.html" style="margin: 0 16px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #FBFAF6; border: 1px solid #DDD8CC; text-decoration: none; color: #17161A">
<span style="display: flex"><img src="../assets/ainura.jpg" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6"><img src="../assets/erlan.jpg" alt="" style="width: 34px; height: 34px; margin-left: -10px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6"></span>
<span style="flex-grow: 1; font-size: 15.5px; font-weight: 600">Запросы</span>
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #F0521F; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; padding: 0 16px">
<sc-for list="{{chats}}" as="c" hint-placeholder-count="5">
<a href="{{c.href}}" style="display: flex; gap: 12px; align-items: center; padding: 10px 0; text-decoration: none; color: #17161A">
<span style="position: relative; width: 54px; height: 54px; flex-shrink: 0">
<sc-if value="{{c.hasPhoto}}" hint-placeholder-val="{{ true }}"><img src="{{c.photo}}" alt="" style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; display: block"></sc-if>
<sc-if value="{{c.isLetter}}" hint-placeholder-val="{{ false }}"><span style="width: 54px; height: 54px; border-radius: 50%; background: {{c.tint}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">{{c.initial}}</span></sc-if>
<sc-if value="{{c.isEvent}}" hint-placeholder-val="{{ false }}"><span style="width: 54px; height: 54px; border-radius: 16px; background: {{c.tint}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0; padding-bottom: 10px; border-bottom: 1px solid #DDD8CC; padding-top: 10px; margin-top: -10px; margin-bottom: -10px">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #55524C; flex-shrink: 0">{{c.time}}</span></span>
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="font-size: 14.5px; color: {{c.lastColor}}; font-weight: {{c.lastWeight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span><sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{ true }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #F0521F; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.unread}}</span></sc-if></span>
</span>
</a>
</sc-for>
</div>
</div>

<sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 96px">
<dc-import name="V3TabBar" active="chats" plans="2" chats="3" hint-size="390px,96px"></dc-import>
</div>
</sc-if>

<sc-if value="{{isFriend}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{close}}" aria-label="Закрыть" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; background: rgba(23,22,26,0.36)"></button>
<div class="v3up" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 30px; border-radius: 24px 24px 0 0; background: #FBFAF6; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFC9BB"></span>
<a href="V3PersonFriend.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #17161A">
<span style="position: relative; width: 56px; height: 56px"><img src="../assets/igor.jpg" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box"><span style="position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: #C77A12; box-shadow: 0 0 0 2px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17"></path></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-family: 'Geologica', sans-serif; font-size: 20px; font-weight: 700">Игорь</span><span style="font-size: 14px; color: #3A3833">Кофейня Saya</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="V3MapFriend.dc.html" aria-label="Открыть на большой карте" style="position: relative; display: block; height: 128px; border-radius: 18px; overflow: hidden; background: #EFEBE2">
<svg width="358" height="128" viewBox="0 0 358 128" aria-hidden="true" style="display: block"><rect width="358" height="128" fill="#EFEBE2"></rect><path d="M0 40H358M0 92H358M70 0V128M170 0V128M270 0V128" stroke="#FBF9F4" stroke-width="6"></path><path d="M0 18H358M0 66H358M120 0V128M220 0V128M320 0V128" stroke="#F6F3EC" stroke-width="3"></path><rect x="226" y="72" width="40" height="34" rx="6" fill="#DCE3CE"></rect></svg>
<img src="../assets/igor.jpg" alt="" style="position: absolute; left: 160px; top: 42px; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 3px solid #2447B8; box-sizing: border-box; box-shadow: 0 0 0 2px #FBFAF6">
<span aria-hidden="true" style="position: absolute; left: 112px; top: 92px; width: 8px; height: 8px; border-radius: 50%; background: #2447B8; box-shadow: 0 0 0 2px #FBFAF6"></span>
<span style="position: absolute; left: 10px; top: 10px; height: 26px; padding: 0 9px; border-radius: 13px; background: rgba(251,250,246,0.95); color: #17161A; display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4.5a1.5 1.5 0 110 .01M10 21l2-6 3 3v3M9 12l2-3.5 3 1 2 3.5M11 8.5L8 10l-1 3"></path></svg>6 мин</span>
<span style="position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(251,250,246,0.95); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></span>
</a>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="V3Chat.dc.html" style="height: 60px; border-radius: 16px; background: #17161A; color: #F3F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Написать</a>
<a href="V3ChatInvite.dc.html" style="height: 60px; border-radius: 16px; background: #F3F0E8; color: #17161A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h12a3 3 0 013 3v10.5a3 3 0 01-3 3H6a3 3 0 01-3-3V7.5a3 3 0 013-3zM3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"></path></svg>Позвать</a>
<a href="V3MapPoint.dc.html" style="height: 60px; border-radius: 16px; background: #FCE3D6; color: #17161A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21zM12 7a2.5 2.5 0 110 5 2.5 2.5 0 010-5z"></path></svg>Точка</a>
</div>
</div>
</sc-if>

<sc-if value="{{hintOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; z-index: 40">
<span aria-hidden="true" style="position: absolute; left: 6px; top: 104px; width: 378px; height: 102px; border-radius: 24px; box-shadow: 0 0 0 1400px rgba(23,22,26,0.74)"></span>
<span aria-hidden="true" style="position: absolute; left: 6px; top: 104px; width: 378px; height: 102px; border-radius: 24px; border: 2.5px solid #F0521F; box-sizing: border-box; animation: v3Spot 1.6s ease-in-out infinite"></span>
<div class="v3hint" style="position: absolute; left: 24px; right: 24px; top: 226px; padding: 18px; border-radius: 22px; background: #FBFAF6; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 14px 34px rgba(23,22,26,0.3)">
<span style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 13px; background: #17161A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 4.5a3.5 3.5 0 010 6.5M18 14.5c2 .6 3.2 2.5 3.5 5.5"></path></svg></span><span style="font-family: 'Geologica', sans-serif; font-size: 21px; font-weight: 700">Друзья</span></span>
<span style="font-size: 15.5px; line-height: 1.4; color: #3A3833">Значок на лице — где друг сейчас: кофе, горы, в пути. Нажми — написать, позвать или точка</span>
<button type="button" onClick="{{closeHint}}" style="height: 46px; border-radius: 14px; border: 0; background: #F0521F; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700; color: #17161A">Понятно</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheet":{"editor":"enum","options":["none","friend"],"default":"none"},"hint":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: props.sheet ?? 'none' };
  }
  renderVals() {
    const s = this.state;
    const I = {
      coffee: 'M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17',
      move: 'M3 11l18-8-8 18-2-8z',
      art: 'M12 3a9 9 0 100 18c1.1 0 1.5-.8 1.5-1.5 0-.9-.7-1.2-.7-2 0-.8.7-1.5 1.5-1.5H17a4 4 0 004-4c0-5-4-9-9-9z',
      hike: 'M3 20l6-10 4 6 3-4 5 8z',
      work: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16'
    };
    const friends = [
      { name: 'Игорь', photo: '../assets/igor.jpg', badge: I.coffee, badgeBg: '#C77A12' },
      { name: 'Денис', photo: '../assets/denis.jpg', badge: I.move, badgeBg: '#2447B8' },
      { name: 'Антон', photo: '../assets/anton.jpg', badge: I.art, badgeBg: '#17161A' },
      { name: 'Тимур', photo: '../assets/timur.jpg', badge: I.hike, badgeBg: '#2F8F5B' },
      { name: 'Арман', photo: '../assets/arman.jpg', badge: I.work, badgeBg: '#6B675F' }
    ].map((f) => ({ ...f, hasPhoto: !!f.photo, noPhoto: !f.photo, hasBadge: !!f.badge, open: () => this.setState({ sheet: 'friend' }) }));
    const chats = [
      { name: 'Игорь', photo: '../assets/igor.jpg', last: 'Точка · 20:30', time: '18:10', unread: 2, href: 'V3Chat.dc.html' },
      { name: 'Тимур', photo: '../assets/timur.jpg', last: 'В субботу в 7:30 у Медеу', time: '18:08', unread: 1, href: 'V3Chat.dc.html' },
      { name: 'Джаз во дворе', isEvent: true, tint: '#F0521F', icon: 'M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z', last: 'Саша: займу столик у сцены', time: '18:02', unread: 0, href: 'EventChat.dc.html' },
      { name: 'Денис', photo: '../assets/denis.jpg', last: 'Стикер «Го?»', time: '17:40', unread: 0, href: 'V3Chat.dc.html' },
      { name: 'Настолки с новыми людьми', isEvent: true, tint: '#D6E0EE', icon: 'M7 4h10a3 3 0 013 3v10a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3zM9 9h.01M15 15h.01M15 9h.01M9 15h.01', last: 'Ерлан: кто берёт Каркассон?', time: '17:38', unread: 0, href: 'EventChat.dc.html' },
      { name: 'Антон', photo: '../assets/anton.jpg', last: 'Ты: фото', time: 'вчера', unread: 0, href: 'V3Chat.dc.html' }
    ].map((c) => ({ ...c, hasPhoto: !!c.photo, isEvent: !!c.isEvent, isLetter: !c.photo && !c.isEvent, initial: c.initial || '', hasUnread: c.unread > 0, unread: String(c.unread), lastColor: c.unread ? '#17161A' : '#55524C', lastWeight: c.unread ? '600' : '400' }));
    return {
      hintOn: !!this.props.hint && this.props.hint !== 'false' && !this.state.hintClosed,
      closeHint: () => this.setState({ hintClosed: true }),
      friends, chats,
      isFriend: s.sheet === 'friend',
      showTabs: s.sheet !== 'friend',
      close: () => this.setState({ sheet: 'none' })
    };
  }
}
</script>
</body>
</html>
