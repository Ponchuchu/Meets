<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Иконка приложения: один вариант</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Pacifico&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; border-radius: {{radius}}; overflow: hidden; position: relative; background: {{p.bg}}; box-shadow: {{shadow}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" aria-label="рядом." style="display: block">
<defs><linearGradient id="{{gid}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="{{hl}}"></stop><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient></defs>
<rect x="0" y="0" width="100" height="100" fill="{{p.bg}}"></rect>
<g transform="{{tf}}">
<sc-if value="{{c1}}" hint-placeholder-val="{{ true }}">
<circle cx="50" cy="50" r="31" fill="none" stroke="{{p.b}}" stroke-width="4"></circle>
<circle cx="50" cy="50" r="17" fill="{{p.a}}"></circle>
</sc-if>
<sc-if value="{{c2}}" hint-placeholder-val="{{ false }}">
<text x="45" y="62" text-anchor="middle" font-family="Geologica, sans-serif" font-weight="800" font-size="66" fill="{{p.a}}">р</text>
<circle cx="74.5" cy="57" r="7" fill="{{p.b}}"></circle>
</sc-if>
<sc-if value="{{c3}}" hint-placeholder-val="{{ false }}">
<path d="M31 39C35 34 39 31 43 31C44 50 42 69 38 85" fill="none" stroke="{{p.a}}" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M42.5 46C48 33 69 30 69 47C69 62 52 66 42 57" fill="none" stroke="{{p.a}}" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="79" cy="59" r="6.2" fill="{{p.b}}"></circle>
</sc-if>
<sc-if value="{{c4}}" hint-placeholder-val="{{ false }}">
<text x="45" y="58" text-anchor="middle" font-family="Geologica, sans-serif" font-weight="800" font-size="24" letter-spacing="-1.2" fill="{{p.a}}">рядом</text>
<circle cx="83.5" cy="55.4" r="3.4" fill="{{p.b}}"></circle>
</sc-if>
<sc-if value="{{c5}}" hint-placeholder-val="{{ false }}">
<circle cx="42" cy="56" r="22" fill="{{p.a}}"></circle>
<circle cx="65" cy="41" r="14" fill="{{p.b}}" stroke="{{p.bg}}" stroke-width="4"></circle>
</sc-if>
<sc-if value="{{c6}}" hint-placeholder-val="{{ false }}">
<path d="M50 17a24 24 0 0124 24c0 18-24 42-24 42S26 59 26 41a24 24 0 0124-24z" fill="{{p.a}}"></path>
<circle cx="50" cy="41" r="9" fill="{{p.b}}"></circle>
</sc-if>
<sc-if value="{{c7}}" hint-placeholder-val="{{ false }}">
<circle cx="50" cy="50" r="41" fill="none" stroke="{{p.a}}" stroke-width="3" stroke-opacity="0.2"></circle>
<circle cx="50" cy="50" r="30" fill="none" stroke="{{p.a}}" stroke-width="3.5" stroke-opacity="0.45"></circle>
<circle cx="50" cy="50" r="19" fill="none" stroke="{{p.a}}" stroke-width="4" stroke-opacity="0.75"></circle>
<circle cx="50" cy="50" r="9" fill="{{p.a}}"></circle>
</sc-if>
<sc-if value="{{c8}}" hint-placeholder-val="{{ false }}">
<path d="M-10 28H110M-10 72H110M28 -10V110M76 -10V110M-10 104L104 -10" fill="none" stroke="{{p.c}}" stroke-width="4"></path>
<path d="M60 -10C52 24 68 58 56 110" fill="none" stroke="{{p.d}}" stroke-width="5"></path>
<path d="M50 52L36 22A32 32 0 0164 22Z" fill="{{p.a}}" fill-opacity="0.3"></path>
<circle cx="50" cy="52" r="14" fill="{{p.b}}"></circle>
<circle cx="50" cy="52" r="9.5" fill="{{p.a}}"></circle>
</sc-if>
</g>
<rect x="0" y="0" width="100" height="100" fill="url(#{{gid}})"></rect>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"concept":{"editor":"int","default":1,"min":1,"max":8},"mode":{"editor":"enum","options":["light","dark","tinted","mono","monodark"],"default":"light"},"shape":{"editor":"enum","options":["ios","circle","squircle","rounded","teardrop","square"],"default":"ios"},"size":{"editor":"int","default":180,"min":16,"max":600},"$preview":{"width":180,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const c = Number(this.props.concept ?? 1) || 1;
    const mode = this.props.mode ?? 'light';
    const shape = this.props.shape ?? 'ios';
    const size = Number(this.props.size ?? 180) || 180;
    const O = '#F0521F', INK = '#17161A', CR = '#FBFAF6', PAPER = '#F3F0E8';
    const L = {
      1: { bg: O, a: CR, b: 'rgba(251,250,246,0.38)' },
      2: { bg: O, a: CR, b: INK },
      3: { bg: INK, a: O, b: CR },
      4: { bg: PAPER, a: INK, b: O },
      5: { bg: INK, a: O, b: CR },
      6: { bg: O, a: CR, b: O },
      7: { bg: INK, a: O, b: O },
      8: { bg: PAPER, a: O, b: CR, c: 'rgba(23,22,26,0.13)', d: 'rgba(36,71,184,0.28)' }
    };
    const DK = '#1C1B20';
    const D = {
      1: { bg: DK, a: O, b: 'rgba(240,82,31,0.4)' },
      2: { bg: DK, a: O, b: CR },
      3: { bg: DK, a: O, b: CR },
      4: { bg: DK, a: PAPER, b: O },
      5: { bg: DK, a: O, b: CR },
      6: { bg: DK, a: O, b: DK },
      7: { bg: DK, a: O, b: O },
      8: { bg: DK, a: O, b: DK, c: 'rgba(243,240,232,0.13)', d: 'rgba(143,193,242,0.3)' }
    };
    const tone = (bg, fg, soft) => ({ bg, a: fg, b: c === 6 || c === 8 ? bg : c === 1 ? soft : fg, c: soft, d: soft });
    const T = { tinted: tone('#0D0D10', '#8FC1F2', 'rgba(143,193,242,0.32)'), mono: tone('#DCE5F4', '#20406E', 'rgba(32,64,110,0.25)'), monodark: tone('#1E2638', '#C4D6F5', 'rgba(196,214,245,0.28)') };
    let p = mode === 'dark' ? D[c] : T[mode] || L[c];
    if ((mode === 'tinted' || mode === 'mono' || mode === 'monodark') && (c === 2 || c === 3)) p = { ...p, b: p.c.replace(/0\.\d+\)/, '0.7)') };
    p = { c: 'transparent', d: 'transparent', ...p };
    const R = { ios: '22.4%', circle: '50%', squircle: '36%', rounded: '16%', teardrop: '50% 50% 16% 50%', square: '0' };
    const android = shape !== 'ios' && shape !== 'square';
    const sc = android ? 0.8 : 1;
    return {
      size: String(size), radius: R[shape] || R.ios, p,
      shadow: size >= 90 ? '0 ' + Math.round(size / 18) + 'px ' + Math.round(size / 7) + 'px rgba(23,22,26,0.18)' : 'none',
      hl: mode === 'mono' || mode === 'monodark' ? '0' : mode === 'light' ? '0.16' : '0.08',
      gid: 'v6icG' + c + mode + shape + size,
      tf: 'translate(50 50) scale(' + sc + ') translate(-50 -50)',
      c1: c === 1, c2: c === 2, c3: c === 3, c4: c === 4, c5: c === 5, c6: c === 6, c7: c === 7, c8: c === 8
    };
  }
}
</script>
</body>
</html>
