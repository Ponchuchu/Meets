<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Запросы v3: незнакомые пишут сюда</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3In{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.v3in{animation:v3In 320ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; padding: 48px 0 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px; padding: 0 16px">
<a href="V3Chats.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 50%; background: #FBFAF6; border: 1px solid #DDD8CC; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Geologica', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Запросы</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
<sc-for list="{{items}}" as="r" hint-placeholder-count="3">
<div class="{{r.cls}}" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 22px; background: #FBFAF6; border: 1px solid #DDD8CC">
<div style="display: flex; align-items: center; gap: 12px">
<a href="{{r.profile}}" style="position: relative; width: 54px; height: 54px; flex-shrink: 0; text-decoration: none; color: #17161A">
<sc-if value="{{r.hasPhoto}}" hint-placeholder-val="{{ true }}"><img src="{{r.photo}}" alt="" style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; display: block; border: 3px solid {{r.ring}}; box-sizing: border-box"></sc-if>
<sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{ false }}"><span style="width: 54px; height: 54px; border-radius: 50%; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; border: 3px solid {{r.ring}}; box-sizing: border-box">{{r.initial}}</span></sc-if>
<span style="position: absolute; right: -3px; bottom: -3px; width: 24px; height: 24px; border-radius: 50%; background: {{r.kindBg}}; box-shadow: 0 0 0 2.5px #FBFAF6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.kindIcon}}"></path></svg></span>
</a>
<a href="{{r.open}}" style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0; text-decoration: none; color: #17161A">
<span style="font-size: 16px; font-weight: 700">{{r.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #3A3833; white-space: nowrap">
<sc-if value="{{r.hasEvent}}" hint-placeholder-val="{{ true }}"><span style="width: 22px; height: 22px; border-radius: 7px; background: #F0521F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z"></path></svg></span></sc-if>
<sc-if value="{{r.hasMutual}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-shrink: 0"><img src="../assets/igor.jpg" alt="" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6"><img src="../assets/denis.jpg" alt="" style="width: 22px; height: 22px; margin-left: -7px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6"></span></sc-if>
<span style="overflow: hidden; text-overflow: ellipsis">{{r.context}}</span>
</span>
</a>
</div>
<sc-if value="{{r.hasPreview}}" hint-placeholder-val="{{ true }}">
<a href="{{r.open}}" style="align-self: flex-start; max-width: 300px; padding: 9px 13px; border-radius: 18px 18px 18px 6px; background: #F3F0E8; font-size: 14.5px; line-height: 1.35; color: #17161A; text-decoration: none">{{r.preview}}</a>
</sc-if>
<sc-if value="{{r.pending}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: 52px 1fr; gap: 8px">
<button type="button" onClick="{{r.decline}}" aria-label="Удалить запрос" style="height: 46px; border-radius: 15px; border: 0; background: #E7E2D6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button type="button" onClick="{{r.accept}}" style="height: 46px; border-radius: 15px; border: 0; background: #17161A; color: #F3F0E8; font-family: 'Golos Text', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.acceptIcon}}"></path></svg>{{r.acceptLabel}}</button>
</div>
</sc-if>
<sc-if value="{{r.accepted}}" hint-placeholder-val="{{ false }}">
<a href="{{r.after}}" class="v3in" style="height: 46px; border-radius: 15px; background: #D6E0EE; color: #17161A; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>{{r.afterLabel}}</a>
</sc-if>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div class="v3in" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 60px 0; color: #55524C">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8F897C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-size: 15px; font-weight: 600">Всё разобрано</span>
</div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: {} };
  }
  renderVals() {
    const st = this.state.st;
    const MSG = 'M4 5h16v11H9l-5 4z';
    const ADD = 'M12 5v14M5 12h14';
    const set = (id, v) => () => this.setState({ st: { ...this.state.st, [id]: v } });
    const base = [
      { id: 'ainura', kind: 'msg', name: 'Айнура', photo: '../assets/ainura.jpg', context: 'тоже идёт на джаз', hasEvent: true, preview: 'Привет! Тоже на джаз? Иду одна, можно вместе', open: 'V3ChatRequest.dc.html', profile: 'V3Person.dc.html', after: 'V3Chat.dc.html', afterLabel: 'Открыть чат' },
      { id: 'erlan', kind: 'friend', name: 'Ерлан', photo: '../assets/erlan.jpg', context: '2 общих', hasMutual: true, open: 'V3Person.dc.html', profile: 'V3Person.dc.html', after: 'V3Chat.dc.html', afterLabel: 'Написать' }
    ];
    const items = base.filter((r) => st[r.id] !== 'no').map((r) => {
      const ok = st[r.id] === 'yes';
      return {
        ...r,
        cls: ok ? 'v3in' : '',
        hasPhoto: !!r.photo, noPhoto: !r.photo, photo: r.photo || '', initial: r.initial || '', tint: r.tint || '#E7E2D6',
        ring: ok && r.kind === 'friend' ? '#2447B8' : 'transparent',
        kindBg: r.kind === 'msg' ? '#17161A' : '#2447B8',
        kindIcon: r.kind === 'msg' ? MSG : ADD,
        hasEvent: !!r.hasEvent, hasMutual: !!r.hasMutual,
        hasPreview: !!r.preview && !ok,
        preview: r.preview || '',
        pending: !ok, accepted: ok,
        acceptLabel: r.kind === 'msg' ? 'Ответить' : 'В друзья',
        acceptIcon: r.kind === 'msg' ? MSG : 'M5 12.5l4.5 4.5L19 7.5',
        accept: set(r.id, 'yes'),
        decline: set(r.id, 'no')
      };
    });
    return { items, empty: items.length === 0 };
  }
}
</script>
</body>
</html>
