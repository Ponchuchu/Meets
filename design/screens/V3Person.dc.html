<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профиль человека v3: фото, друзья, написать</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3Up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v3Pill{0%{transform:translateY(-12px);opacity:0}15%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes v3Fade{from{opacity:0.4}to{opacity:1}}
.v3up{animation:v3Up 260ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto">

<div style="position: relative; width: 390px; height: 520px; background: #17161A; overflow: hidden">
<img src="{{photo}}" alt="{{name}}" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; object-fit: cover; animation: v3Fade 220ms ease both">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(to top, rgba(23,22,26,0.82), rgba(23,22,26,0))"></span>
<div style="position: absolute; left: 12px; right: 12px; top: 102px; display: flex; gap: 4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="3"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: {{b.bg}}"></span></sc-for>
</div>
<button type="button" onClick="{{prev}}" aria-label="Предыдущее фото" style="position: absolute; left: 0; top: 110px; width: 130px; height: 300px; border: 0; background: transparent; cursor: w-resize"></button>
<button type="button" onClick="{{next}}" aria-label="Следующее фото" style="position: absolute; right: 0; top: 110px; width: 260px; height: 300px; border: 0; background: transparent; cursor: e-resize"></button>
<div style="position: absolute; left: 18px; right: 18px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; color: #F3F0E8">
<span style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'Geologica', sans-serif; font-size: 32px; font-weight: 700">{{name}}</span><span style="width: 30px; height: 30px; border-radius: 50%; background: {{badgeBg}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{badge}}"></path></svg></span></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14.5px"><span style="display: flex"><img src="../assets/igor.jpg" alt="" style="width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 2px solid #17161A"><img src="../assets/denis.jpg" alt="" style="width: 26px; height: 26px; margin-left: -8px; border-radius: 50%; object-fit: cover; border: 2px solid #17161A"></span>{{mutual}}</span>
</div>
</div>

<div style="padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{isStranger}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{addFriend}}" aria-label="Добавить в друзья" style="width: 58px; height: 54px; border-radius: 16px; border: 1px solid #CFC9BB; background: {{addBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{addIcon}}"></path></svg></button>
<button type="button" onClick="{{openWrite}}" style="flex-grow: 1; height: 54px; border-radius: 16px; border: 0; background: {{writeBg}}; color: {{writeFg}}; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>{{writeLabel}}</button>
</div>
</sc-if>
<sc-if value="{{isFriend}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="V3Chat.dc.html" style="height: 64px; border-radius: 16px; background: #17161A; color: #F3F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Написать</a>
<a href="V3EventHow.dc.html" style="height: 64px; border-radius: 16px; background: #FBFAF6; border: 1px solid #DDD8CC; box-sizing: border-box; color: #17161A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h12a3 3 0 013 3v10.5a3 3 0 01-3 3H6a3 3 0 01-3-3V7.5a3 3 0 013-3zM3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"></path></svg>Позвать</a>
<a href="V3MapFriend.dc.html" style="height: 64px; border-radius: 16px; background: #FBFAF6; border: 1px solid #DDD8CC; box-sizing: border-box; color: #17161A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"></path></svg>На карте</a>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 700">Идёт</span>
<div style="display: flex; gap: 10px; overflow-x: auto; flex-shrink: 0">
<sc-for list="{{events}}" as="e" hint-placeholder-count="2">
<a href="V3Event.dc.html" style="width: 168px; flex-shrink: 0; border-radius: 18px; overflow: hidden; background: #FBFAF6; border: 1px solid #DDD8CC; text-decoration: none; color: #17161A">
<span style="position: relative; display: flex; align-items: flex-end; height: 76px; padding: 8px 10px; box-sizing: border-box; background: {{e.bg}}; color: {{e.fg}}; font-family: 'Geologica', sans-serif; font-size: 15px; font-weight: 800; line-height: 1; text-transform: uppercase">{{e.title}}<sc-if value="{{e.together}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 8px; top: 8px; padding: 3px 8px; border-radius: 10px; background: #FBFAF6; color: #17161A; font-family: 'Golos Text', sans-serif; font-size: 11px; font-weight: 700; text-transform: none">и ты</span></sc-if></span>
<span style="display: block; padding: 8px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; color: #3A3833">{{e.when}}</span>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{interests}}" as="i" hint-placeholder-count="4">
<span style="height: 36px; padding: 0 12px; border-radius: 18px; background: {{i.bg}}; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>{{i.label}}</span>
</sc-for>
</div>

<a href="V3FriendsOf.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #FBFAF6; border: 1px solid #DDD8CC; text-decoration: none; color: #17161A">
<span style="display: flex"><img src="../assets/anton.jpg" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6"><img src="../assets/denis.jpg" alt="" style="width: 36px; height: 36px; margin-left: -10px; border-radius: 50%; object-fit: cover; border: 2px solid #FBFAF6"><span style="width: 36px; height: 36px; margin-left: -10px; border-radius: 50%; background: #D9E4D2; border: 2px solid #FBFAF6; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">Т</span></span>
<span style="flex-grow: 1; font-size: 16px; font-weight: 600">{{friendsLabel}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>
</div>

<a href="V3Event.dc.html" aria-label="Назад" style="position: absolute; left: 16px; top: 48px; width: 44px; height: 44px; border-radius: 50%; background: rgba(251,250,246,0.9); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<button type="button" aria-label="Ещё: пожаловаться, скрыть" style="position: absolute; right: 16px; top: 48px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(251,250,246,0.9); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#17161A" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>

<sc-if value="{{showPill}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 104px; transform: translateX(-50%); padding: 9px 16px; border-radius: 18px; background: #17161A; color: #F3F0E8; font-size: 14px; font-weight: 600; white-space: nowrap; animation: v3Pill 2.8s ease both">{{pillText}}</div>
</sc-if>

<sc-if value="{{isWrite}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{close}}" aria-label="Закрыть" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; background: rgba(23,22,26,0.4)"></button>
<div class="v3up" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 30px; border-radius: 24px 24px 0 0; background: #FBFAF6; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFC9BB"></span>
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/ainura.jpg" alt="" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Айнура</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: #3A3833"><span style="width: 18px; height: 18px; border-radius: 5px; background: #F0521F; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z"></path></svg></span>вы оба идёте на джаз</span></span>
</div>
<div style="min-height: 92px; padding: 14px; border-radius: 16px; background: #F3F0E8; border: 1.5px solid #17161A; box-sizing: border-box; font-size: 16px; line-height: 1.4">Привет! Тоже первый раз на джазе во дворе — встретимся у входа?</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: flex; align-items: center; gap: 6px; flex-grow: 1; font-size: 13.5px; color: #55524C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55524C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"></path></svg>Придёт как запрос</span>
<button type="button" onClick="{{send}}" style="height: 50px; padding: 0 22px; border-radius: 16px; border: 0; background: #F0521F; font-family: 'Golos Text', sans-serif; font-size: 16px; font-weight: 700; color: #17161A; display: flex; align-items: center; gap: 8px">Отправить<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"></path></svg></button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["ainura","igor"],"default":"ainura"},"step":{"editor":"enum","options":["none","write","sent"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const st = props.step ?? 'none';
    this.state = { i: 0, sheet: st === 'write' ? 'write' : null, sent: st === 'sent', added: false, pill: null };
    this.timer = null;
  }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  pill(t) {
    if (this.timer) clearTimeout(this.timer);
    this.setState({ pill: t });
    this.timer = setTimeout(() => this.setState({ pill: null }), 2800);
  }
  renderVals() {
    const s = this.state;
    const who = this.props.who ?? 'ainura';
    const P = {
      ainura: { name: 'Айнура, 29', photos: ['../assets/ainura.jpg', '../assets/hike.jpg'], badge: 'M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z', badgeBg: '#F0521F', mutual: '2 общих друга', friend: false, friendsLabel: 'Друзья · 41', events: [{ title: 'Джаз во дворе', when: 'СЕГОДНЯ 19:30', bg: '#F0521F', fg: '#17161A', together: true }, { title: 'Стендап', when: 'ПТ 20:00', bg: '#17161A', fg: '#F3F0E8' }] },
      igor: { name: 'Игорь, 25', photos: ['../assets/igor1.jpg', '../assets/igor2.jpg', '../assets/igor3.jpg', '../assets/igor4.jpg'], badge: 'M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17', badgeBg: '#C77A12', mutual: '7 общих друзей', friend: true, friendsLabel: 'Друзья Игоря · 34', events: [{ title: 'Джаз во дворе', when: 'СЕГОДНЯ 19:30', bg: '#F0521F', fg: '#17161A', together: true }, { title: 'Шашлыки у Антона', when: 'ВС 14:00', bg: '#D9E4D2', fg: '#17161A' }] }
    }[who];
    const n = P.photos.length;
    const idx = ((s.i % n) + n) % n;
    const I = {
      music: 'M9 18V5l11-2v13M6 15a3 3 0 110 6 3 3 0 010-6zM17 13a3 3 0 110 6 3 3 0 010-6z',
      mic: 'M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3',
      hike: 'M3 20l6-10 4 6 3-4 5 8z',
      camera: 'M4 8h4l2-3h4l2 3h4v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z'
    };
    const interests = [
      { label: 'Джаз', icon: I.music, bg: '#F0521F' },
      { label: 'Стендап', icon: I.mic, bg: '#EADFB8' },
      { label: 'Горы', icon: I.hike, bg: '#D9E4D2' },
      { label: 'Плёнка', icon: I.camera, bg: '#D6E0EE' }
    ];
    return {
      name: P.name,
      photo: P.photos[idx],
      bars: P.photos.map((_, k) => ({ bg: k === idx ? '#FBFAF6' : 'rgba(251,250,246,0.4)' })),
      badge: P.badge, badgeBg: P.badgeBg,
      mutual: P.mutual,
      isStranger: !P.friend,
      isFriend: P.friend,
      events: P.events.map((e) => ({ ...e, together: !!e.together })),
      interests,
      friendsLabel: P.friendsLabel,
      writeLabel: s.sent ? 'Запрос отправлен' : 'Написать',
      writeBg: s.sent ? '#E7E2D6' : '#17161A',
      writeFg: s.sent ? '#3A3833' : '#F3F0E8',
      addBg: s.added ? '#D9E4D2' : '#FBFAF6',
      addIcon: s.added ? 'M5 12.5l4.5 4.5L19 7.5' : 'M9 4.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M19 8v6M16 11h6',
      isWrite: s.sheet === 'write',
      showPill: !!s.pill && !s.sheet,
      pillText: s.pill || '',
      prev: () => this.setState({ i: s.i - 1 }),
      next: () => this.setState({ i: s.i + 1 }),
      openWrite: () => { if (!s.sent) this.setState({ sheet: 'write' }); },
      close: () => this.setState({ sheet: null }),
      send: () => { this.setState({ sheet: null, sent: true }); this.pill('Запрос отправлен · ответ придёт в Чаты'); },
      addFriend: () => { this.setState({ added: !s.added }); if (!s.added) this.pill('Заявка в друзья отправлена'); }
    };
  }
}
</script>
</body>
</html>
