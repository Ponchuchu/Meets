<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настоящие события Алматы, 4–12 октября</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v6rvIn{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</helmet>
<div style="width: 1600px; height: 1010px; box-sizing: border-box; padding: 44px 56px; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: #8A3A12">НАСТОЯЩИЕ ДАННЫЕ · НАЙДЕНО 4 ОКТЯБРЯ 2026</div>
<h1 style="margin: 8px 0 0; font-family: 'Geologica', sans-serif; font-size: 42px; font-weight: 800; letter-spacing: -0.04em">Что реально идёт в Алматы на этой неделе</h1>
<div style="margin-top: 6px; font-size: 15px; color: #5F5B55">Так карточки будут выглядеть после сбора: название, время, место, цена и откуда взяли. Даты сверены по источникам; «?» — не нашли на странице.</div>
<div style="margin-top: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{ev}}" as="e" hint-placeholder-count="16">
<div style="border-radius: 22px; overflow: hidden; background: #FBFAF6; animation: v6rvIn 450ms ease {{e.dl}}s both">
<div style="position: relative; height: 92px; background: {{e.bg}}; color: {{e.fg}}; padding: 14px 16px; box-sizing: border-box">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; top: 18px; opacity: 0.5"><path d="{{e.i}}"></path></svg>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em">{{e.cat}}</div>
<div style="margin-top: 6px; font-family: 'Geologica', sans-serif; font-size: 22px; font-weight: 800">{{e.when}}</div>
</div>
<div style="padding: 12px 16px 14px">
<div style="font-size: 16px; font-weight: 700; line-height: 1.25; min-height: 40px">{{e.t}}</div>
<div style="margin-top: 6px; font-size: 13.5px; color: #4A463F">{{e.place}}</div>
<div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13.5px; font-weight: 700">{{e.price}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8F897C">{{e.src}}</span></div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>

</script>
</body>
