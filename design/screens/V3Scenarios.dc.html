<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>v3: 10 сценариев и самокритика</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#E9E5DB}</style>
</helmet>
<div style="width: 1800px; height: 1680px; box-sizing: border-box; padding: 40px; background: #F3F0E8; color: #17161A; font-family: 'Golos Text', sans-serif; display: flex; flex-direction: column; gap: 26px">

<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Geologica', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.01em">рядом. v3 — 10 сценариев: сколько тапов до цели</span>
<span style="font-size: 17px; color: #3A3833">Тапы считаем от открытой вкладки. Каждый шаг — реальный экран ниже, на него можно нажать.</span>
</div>
<div style="display: flex; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; color: #3A3833">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="5"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 5px; background: {{l.bg}}; border: {{l.border}}; box-sizing: border-box"></span>{{l.label}}</span></sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{scenarios}}" as="s" hint-placeholder-count="10">
<div style="height: 196px; box-sizing: border-box; padding: 18px 20px; border-radius: 24px; background: #FBFAF6; border: 1px solid #DDD8CC; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #17161A; color: #F3F0E8; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; flex-shrink: 0">{{s.n}}</span>
<span style="flex-grow: 1; font-family: 'Geologica', sans-serif; font-size: 21px; font-weight: 700">{{s.goal}}</span>
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{s.tapBg}}; color: {{s.tapFg}}; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; white-space: nowrap">{{s.taps}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px">
<sc-for list="{{s.steps}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="height: 40px; padding: 0 13px 0 10px; border-radius: 13px; background: {{t.bg}}; color: {{t.fg}}; border: {{t.border}}; box-sizing: border-box; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</a>
<sc-if value="{{t.arrow}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8F897C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"></path></svg></sc-if>
</sc-for>
</div>
<span style="font-size: 14px; line-height: 1.35; color: #55524C">{{s.note}}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px">
<div style="padding: 20px; border-radius: 24px; background: #17161A; color: #F3F0E8; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Geologica', sans-serif; font-size: 22px; font-weight: 700">Критикую v2 — что исправлено в v3</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px">
<sc-for list="{{critique}}" as="c" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 14px; background: #2B2A2E">
<span style="display: flex; gap: 8px; font-size: 14px; color: #B9B2A3; line-height: 1.3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0521F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M6 6l12 12M18 6L6 18"></path></svg>{{c.was}}</span>
<span style="display: flex; gap: 8px; font-size: 14.5px; font-weight: 600; line-height: 1.3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FC79C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{c.now}}</span>
</div>
</sc-for>
</div>
</div>
<div style="padding: 20px; border-radius: 24px; background: #FBFAF6; border: 1px solid #DDD8CC; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Geologica', sans-serif; font-size: 22px; font-weight: 700">Правила простоты</span>
<sc-for list="{{rules}}" as="r" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 38px; height: 38px; border-radius: 12px; background: #F3F0E8; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="font-size: 15px; line-height: 1.3">{{r.text}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":1680}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      map: 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15',
      feed: 'M8.5 3h9.5a2.5 2.5 0 012.5 2.5v10a2.5 2.5 0 01-2.5 2.5h-7a2.5 2.5 0 01-2.5-2.5zM5 7.5v10.5a3 3 0 003 3h8',
      plans: 'M6 4.5h12a3 3 0 013 3v10.5a3 3 0 01-3 3H6a3 3 0 01-3-3V7.5a3 3 0 013-3zM3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.3 2.3 4.7-4.6',
      chat: 'M4 5h16v11H9l-5 4z',
      me: 'M12 4a4 4 0 110 8 4 4 0 010-8zM4 21c1-4 4.2-6 8-6s7 2 8 6',
      pin: 'M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21zM12 7a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
      check: 'M5 12.5l4.5 4.5L19 7.5',
      face: 'M12 4a4 4 0 110 8 4 4 0 010-8zM4 21c1-4 4.2-6 8-6s7 2 8 6',
      people: 'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 4.5a3.5 3.5 0 010 6.5M18 14.5c2 .6 3.2 2.5 3.5 5.5',
      plus: 'M12 5v14M5 12h14',
      filter: 'M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4',
      swipe: 'M5 12h13M13 7l5 5-5 5',
      flame: 'M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2.5 1.5-4 2.5-5 .3 1.7 1 2.7 2 3 .5-2.5.5-5.5.5-8z',
      gift: 'M4 9h16v4H4zM5 13h14v8H5zM12 9v12M12 9c-1.5-3.5-5.5-4-5.5-1.5S9 9 12 9zM12 9c1.5-3.5 5.5-4 5.5-1.5S15 9 12 9',
      coffee: 'M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V8zM17 10h1.5a2.5 2.5 0 010 5H17',
      bell: 'M6 16v-5a6 6 0 0112 0v5l1.5 2h-15zM10 20.5a2 2 0 004 0',
      hand: 'M8 13V5.5a1.5 1.5 0 013 0V11M11 10.5V4a1.5 1.5 0 013 0v6.5M14 10V5.5a1.5 1.5 0 013 0V13M17 9.5a1.5 1.5 0 013 0V14a7 7 0 01-7 7h-1a6 6 0 01-5-2.7L4.5 15a1.6 1.6 0 012.6-1.8L8 14.5',
      send: 'M4 12l16-8-6 16-2.5-6.5z',
      spark: 'M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6',
      eye: 'M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM12 9.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
      sticker: 'M5 4h14v11l-5 5H5zM14 20v-5h5M9 10h.01M15 10h.01M9.5 13.5c.8.7 1.6 1 2.5 1',
      lock: 'M6 11h12v10H6zM8.5 11V8a3.5 3.5 0 017 0v3',
      clock: 'M12 3a9 9 0 110 18 9 9 0 010-18zM12 7v5l3 2',
      layers: 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',
      timer: 'M12 6a7 7 0 110 14 7 7 0 010-14zM12 10v4M9.5 2.5h5',
      hide: 'M3 3l18 18M10.5 6.2A9.6 9.6 0 0112 6c6 0 9.5 6 9.5 6a17 17 0 01-2.8 3.5M6.6 6.6A17 17 0 002.5 12S6 18 12 18c1.6 0 3-.4 4.3-1'
    };
    const T = {
      tab: { bg: '#F0521F', fg: '#17161A', border: '0' },
      screen: { bg: '#F3F0E8', fg: '#17161A', border: '1px solid #CFC9BB' },
      act: { bg: '#17161A', fg: '#F3F0E8', border: '0' },
      other: { bg: '#2447B8', fg: '#FBFAF6', border: '0' },
      gest: { bg: '#E7E2D6', fg: '#17161A', border: '1px dashed #8F897C' }
    };
    const st = (kind, label, icon, href) => ({ ...T[kind], label, icon, href: href || '#' });
    const sc = (n, goal, taps, steps, note) => ({
      n: String(n), goal, taps: taps + (taps === 1 ? ' тап' : (taps < 5 ? ' тапа' : ' тапов')),
      tapBg: taps <= 2 ? '#D9E4D2' : '#EADFB8', tapFg: '#17161A',
      steps: steps.map((s, i) => ({ ...s, arrow: i < steps.length - 1 })), note
    });
    return {
      legend: [
        { label: 'ВКЛАДКА', ...T.tab }, { label: 'ЭКРАН', ...T.screen }, { label: 'ГЛАВНАЯ КНОПКА', ...T.act }, { label: 'ДРУГОЙ ЧЕЛОВЕК', ...T.other }, { label: 'ЖЕСТ / ПУШ', ...T.gest }
      ],
      scenarios: [
        sc(1, 'Написать сообщение', 2, [st('tab', 'Чаты', I.chat, 'V3Chats.dc.html'), st('screen', 'Лицо друга сверху', I.face, 'V3ChatsFriend.dc.html'), st('act', 'Написать', I.chat, 'V3Chat.dc.html')], 'Незнакомому: профиль → «Написать» → уходит как запрос. Он отвечает — открывается обычный чат.'),
        sc(2, 'Найти знакомого среди друзей друга', 3, [st('tab', 'Чаты', I.chat, 'V3Chats.dc.html'), st('screen', '+ Найти', I.plus, 'V3FindPeople.dc.html'), st('screen', 'Друзья Игоря', I.people, 'V3FriendsOf.dc.html'), st('act', '+ в друзья', I.plus, 'V3FriendsOf.dc.html')], 'Сверху — общие друзья и те, кто идёт туда же. Список видно, только если друг это разрешил.'),
        sc(3, 'Что рядом сейчас или в субботу', 2, [st('tab', 'Карта', I.map, 'V3Map.dc.html'), st('screen', 'Чипс «Сейчас · +21°»', I.clock, 'V3MapDays.dc.html'), st('screen', 'Сб 3 · дождь', I.pin, 'V3MapRain.dc.html'), st('act', 'Пойду', I.check, 'V3MapPin.dc.html')], 'День и погода — один чипс. Выбрал субботу — пины субботы, лица друзей на тех, куда они идут, и дождь на карте.'),
        sc(4, 'Скучно', 1, [st('tab', 'Подборка', I.feed, 'V3Feed.dc.html'), st('gest', 'Свайп вправо', I.swipe, 'V3Feed.dc.html'), st('screen', '+1 на «Планах»', I.plans, 'V3Plans.dc.html')], 'Карточка сама улетает во вкладку «Планы». Подсказок текстом нет — учит анимация.'),
        sc(5, 'Уровень и награды', 2, [st('tab', 'Профиль', I.me, 'V3Me.dc.html'), st('screen', 'Уровень 6', I.flame, 'V3Quests.dc.html'), st('act', 'Забрать +20', I.flame, 'V3Quests.dc.html'), st('screen', 'Новый уровень', I.gift, 'V3LevelUp.dc.html')], 'Огоньки за реальные дела: сходил, позвал, познакомился. Награды — стикеры и кольцо вокруг аватара.'),
        sc(6, 'Где друг и встретиться', 2, [st('tab', 'Карта', I.map, 'V3Map.dc.html'), st('screen', 'Лицо со значком', I.coffee, 'V3MapFriend.dc.html'), st('act', 'Точка «тут, 20:30»', I.pin, 'V3MapPoint.dc.html')], 'Значок на лице: кофе, горы, работа, в пути. «Точка» — метка на карте и время, у друга она появится в чате с кнопкой «Иду».'),
        sc(7, 'Ответить на приглашение', 1, [st('gest', 'Пуш «Игорь зовёт»', I.bell, 'V3Notify.dc.html'), st('act', 'Пойду', I.check, 'V3Notify.dc.html'), st('other', 'Игорь узнал', I.face, 'V3Chat.dc.html')], 'Ответ прямо из пуша, без открытия приложения. Он же появится в чате и в «Планах».'),
        sc(8, 'Мои планы', 1, [st('tab', 'Планы', I.plans, 'V3Plans.dc.html'), st('screen', 'Зовут', I.check, 'V3Plans.dc.html'), st('screen', 'День → событие', I.clock, 'V3EventGoing.dc.html')], 'Сверху неделя с точками, ниже «Зовут», дальше по дням. У каждого — кто идёт и кто ещё думает.'),
        sc(9, 'Познакомиться с классной девушкой', 3, [st('screen', 'Событие · Идут', I.people, 'V3Event.dc.html'), st('screen', 'Лицо с рукой', I.hand, 'V3Person.dc.html'), st('act', 'Написать', I.chat, 'V3PersonWrite.dc.html'), st('act', 'Отправить', I.send, 'V3PersonWrite.dc.html'), st('other', 'Она: «Ответить»', I.chat, 'V3ChatRequest.dc.html')], 'Рука — «ищет компанию», повод уже есть: «вы оба на джазе». После события — «Планы → Были» и «+» на её лице.'),
        sc(10, 'Новичок: что тут есть?', 5, [st('screen', 'Карта на сутки', I.map, 'V3FirstRun.dc.html'), st('gest', '5 подсказок', I.spark, 'V3FirstRun.dc.html'), st('gest', 'Подсказка на экране', I.spark, 'V3FeedHint.dc.html'), st('act', 'Понятно', I.check, 'V3Map.dc.html')], 'Сначала 5 подсветок: день и погода, потом вкладки. Дальше на каждом экране один раз — своя подсказка. Без регистрации до первого «Пойду».')
      ],
      critique: [

        { was: 'Фразы «хотят дружить 2 Ерлан и Мира»', now: 'Лица с синим «+» — одно касание' },
        { was: '«Алматы открыт на 20%» — непонятная цифра', now: 'Мини-карта «Где был · 12» с иконками мест' },
        { was: 'Полоса дат съедала карту', now: 'День и погода — один чипс, лента дней по тапу' },
        { was: 'В событии видно только друзей', now: 'Видно всех; рука — «ищет компанию»' },

        { was: 'Даты в фильтре: Сегодня / Завтра / Выходные', now: 'Фильтр только про «что»: категории, цена, порядок' }
      ],
      rules: [
        { icon: I.layers, text: 'Один главный жест или кнопка на экран' },
        { icon: I.eye, text: 'Иконка вместо фразы; подписи — у вкладок и главных кнопок' },
        { icon: I.timer, text: 'Любая цель — не больше 3 тапов от вкладки' },
        { icon: I.check, text: 'Каждый ответ виден сразу: кнопка меняется, «+1» на вкладке, плашка на 1,8 с' },
        { icon: I.lock, text: 'Незнакомые — только через запрос' },
        { icon: I.hide, text: 'Пустых экранов нет: в пустых «Планах» — три карточки из Подборки' },
        { icon: I.bell, text: 'Пуш — только когда можно ответить одной кнопкой' }

    };
  }
}
</script>
</body>
</html>
