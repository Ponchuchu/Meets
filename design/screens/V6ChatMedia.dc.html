<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Голосовые и кружки: зажал, смахнул вверх — пишется без рук</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v6cmBtn{0%,10%{transform:scale(1)}13%,72%{transform:scale(1.9)}76%,100%{transform:scale(1)}}
@keyframes v6cmHalo{0%,12%{transform:scale(1);opacity:0}14%{opacity:0.55}20%{transform:scale(2.6);opacity:0.25}26%{transform:scale(2.2);opacity:0.45}32%{transform:scale(2.8);opacity:0.2}40%{transform:scale(2.3);opacity:0.45}48%{transform:scale(2.9);opacity:0.2}56%{transform:scale(2.4);opacity:0.4}64%{transform:scale(2.7);opacity:0.25}72%{transform:scale(2.2);opacity:0.4}75%,100%{transform:scale(1);opacity:0}}
@keyframes v6cmRec{0%,11%{opacity:0;transform:translateX(30px)}14%,72%{opacity:1;transform:translateX(0)}75%,100%{opacity:0}}
@keyframes v6cmIdle{0%,11%{opacity:1}13%,74%{opacity:0}77%,100%{opacity:1}}
@keyframes v6cmDot{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes v6cmLock{0%,13%{opacity:0;transform:translateY(20px)}17%,30%{opacity:1;transform:translateY(0)}36%,72%{opacity:1;transform:translateY(46px) scale(0.9)}75%,100%{opacity:0;transform:translateY(46px)}}
@keyframes v6cmShack{0%,33%{transform:translateY(-3px)}36%,100%{transform:translateY(0)}}
@keyframes v6cmCancel{0%,35%{opacity:1}37%,100%{opacity:0}}
@keyframes v6cmLocked{0%,35%{opacity:0}38%,72%{opacity:1}75%,100%{opacity:0}}
@keyframes v6cmBar{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1)}}
@keyframes v6cmMsg{0%,74%{opacity:0;transform:translateY(40px) scale(0.9)}79%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes v6cmList{0%,74%{transform:translateY(0)}79%,100%{transform:translateY(-70px)}}
@keyframes v6cmPlay{0%,81%{clip-path:inset(0 100% 0 0)}99%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
@keyframes v6cmHead{0%,81%{left:0%;opacity:0}82%{opacity:1}99%{left:100%;opacity:1}100%{left:100%;opacity:0}}
@keyframes v6cmPI{0%,81%{opacity:1}82%,99%{opacity:0}100%{opacity:1}}
@keyframes v6cmPP{0%,81%{opacity:0}82%,99%{opacity:1}100%{opacity:0}}
@keyframes v6cmT{0%,81%{opacity:1}82%,100%{opacity:0}}
@keyframes v6cmFinger{0%,8%{left:356px;top:784px;opacity:0}10%{opacity:1;left:356px;top:784px}30%{left:356px;top:784px;opacity:1}36%{left:356px;top:664px;opacity:1}39%{opacity:0;left:356px;top:664px}68%{opacity:0;left:356px;top:784px}70%{opacity:1;transform:scale(1)}72%{transform:scale(0.8)}74%{transform:scale(1);opacity:1}76%,100%{opacity:0;left:356px;top:784px}}
@keyframes v6cmCam{0%,11%{transform:scale(0.2);opacity:0}16%,72%{transform:scale(1);opacity:1}76%,100%{transform:scale(0.3) translate(120px,300px);opacity:0}}
@keyframes v6cmDim{0%,11%{opacity:0}15%,72%{opacity:1}76%,100%{opacity:0}}
@keyframes v6cmRing{0%,14%{stroke-dashoffset:880}72%{stroke-dashoffset:560}100%{stroke-dashoffset:560}}
@keyframes v6cmCirc{0%,74%{opacity:0;transform:scale(0.4)}80%,100%{opacity:1;transform:scale(1)}}
@keyframes v6cmRing2{0%,80%{stroke-dashoffset:597}100%{stroke-dashoffset:300}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEBE2; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 108px; box-sizing: border-box; padding: 52px 12px 0; background: rgba(251,250,246,0.95); border-bottom: 1px solid #E4DFD3; display: flex; align-items: center; gap: 10px; z-index: 3">
<span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
<img src="../assets/arman.jpg" alt="" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover">
<div><div style="font-size: 17px; font-weight: 700">Арман</div><div style="font-size: 13px; color: #5F5B55">{{status}}</div></div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 108px; bottom: 96px; overflow: hidden">
<div style="position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; animation: v6cmList 9s cubic-bezier(.2,.8,.2,1) infinite">
<div style="align-self: flex-start; max-width: 260px; padding: 9px 12px; border-radius: 18px 18px 18px 6px; background: #FBFAF6; font-size: 16px">Ну что, идём на стендап?</div>
<div style="align-self: flex-start; max-width: 260px; padding: 9px 12px; border-radius: 18px 18px 18px 6px; background: #FBFAF6; font-size: 16px">Скажи голосом, мне лень читать</div>
</div>
<sc-if value="{{isVoice}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; right: 12px; bottom: 10px; width: 240px; box-sizing: border-box; padding: 10px 12px; border-radius: 20px 20px 6px 20px; background: #F0521F; display: flex; align-items: center; gap: 10px; transform-origin: 100% 100%; animation: v6cmMsg 9s cubic-bezier(.2,.8,.2,1) infinite">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #17161A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="position: relative; width: 16px; height: 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F0521F" style="position: absolute; left: 1px; top: 0; animation: v6cmPI 9s linear infinite"><path d="M7 4l13 8-13 8z"></path></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="#F0521F" style="position: absolute; left: 0; top: 0; animation: v6cmPP 9s linear infinite"><rect x="6" y="4" width="4" height="16" rx="1.2"></rect><rect x="14" y="4" width="4" height="16" rx="1.2"></rect></svg></span></span>
<span style="position: relative; flex: 1; height: 30px; display: flex; align-items: center; gap: 2px">
<sc-for list="{{wave}}" as="w" hint-placeholder-count="28"><span style="width: 3px; height: {{w.h}}px; border-radius: 2px; background: rgba(23,22,26,0.35)"></span></sc-for>
<span style="position: absolute; left: 0; top: 0; bottom: 0; right: 0; display: flex; align-items: center; gap: 2px; animation: v6cmPlay 9s linear infinite"><sc-for list="{{wave}}" as="w" hint-placeholder-count="28"><span style="width: 3px; flex-shrink: 0; height: {{w.h}}px; border-radius: 2px; background: #17161A"></span></sc-for></span>
<span aria-hidden="true" style="position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #17161A; box-shadow: 0 0 0 2px #F0521F; animation: v6cmHead 9s linear infinite"></span>
</span>
<span style="position: relative; width: 28px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(23,22,26,0.75)"><span style="animation: v6cmT 9s linear infinite">0:12</span></span>
</div>
</sc-if>
<sc-if value="{{isCircle}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 16px; bottom: 10px; width: 200px; height: 200px; transform-origin: 100% 100%; animation: v6cmCirc 9s cubic-bezier(.2,1.3,.4,1) infinite">
<img src="../assets/pub.jpg" alt="" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover">
<svg width="200" height="200" viewBox="0 0 200 200" style="position: absolute; left: 0; top: 0"><circle cx="100" cy="100" r="95" fill="none" stroke="#F0521F" stroke-width="5" stroke-dasharray="597" stroke-linecap="round" transform="rotate(-90 100 100)" style="animation: v6cmRing2 9s linear infinite"></circle></svg>
<span style="position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 2px 8px; border-radius: 9px; background: rgba(23,22,26,0.6); color: #F3F0E8; font-family: 'JetBrains Mono', monospace; font-size: 11px">0:07</span>
</div>
</sc-if>
</div>

<sc-if value="{{isCircle}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(23,22,26,0.7); z-index: 4; animation: v6cmDim 9s ease infinite"></div>
<div style="position: absolute; left: 45px; top: 200px; width: 300px; height: 300px; z-index: 5; animation: v6cmCam 9s cubic-bezier(.2,.8,.2,1) infinite">
<img src="../assets/pub.jpg" alt="" style="width: 300px; height: 300px; border-radius: 50%; object-fit: cover">
<svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; left: 0; top: 0"><circle cx="150" cy="150" r="146" fill="none" stroke="rgba(251,250,246,0.3)" stroke-width="6"></circle><circle cx="150" cy="150" r="146" fill="none" stroke="#F0521F" stroke-width="6" stroke-dasharray="917" stroke-linecap="round" transform="rotate(-90 150 150)" style="animation: v6cmRing 9s linear infinite"></circle></svg>
</div>
</sc-if>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; box-sizing: border-box; padding: 10px 12px 34px; background: #FBFAF6; display: flex; align-items: center; gap: 8px; z-index: 6">
<div style="position: relative; flex: 1; height: 44px">
<div style="position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; animation: v6cmIdle 9s ease infinite"><span style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A3833" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 109 9M12 3a9 9 0 019 9M12 3v4a5 5 0 005 5h4"></path></svg></span><span style="flex: 1; height: 42px; border-radius: 21px; background: #EDE9DF; display: flex; align-items: center; padding: 0 14px; color: #8F897C; font-size: 16px">Сообщение</span></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; animation: v6cmRec 9s ease infinite">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #C2321F; animation: v6cmDot 1s ease infinite"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">0:0{{sec}}</span>
<span style="position: relative; flex: 1; height: 24px">
<span style="position: absolute; inset: 0; display: flex; align-items: center; font-size: 14px; color: #5F5B55; animation: v6cmCancel 9s ease infinite">‹ влево — отмена</span>
<span style="position: absolute; inset: 0; display: flex; align-items: center; gap: 3px; animation: v6cmLocked 9s ease infinite"><sc-for list="{{live}}" as="l" hint-placeholder-count="16"><span style="width: 3px; height: 22px; border-radius: 2px; background: #F0521F; transform-origin: 50% 50%; animation: v6cmBar {{l.t}}s ease-in-out {{l.d}}s infinite"></span></sc-for></span>
</span>
</div>
</div>
<span style="position: relative; width: 44px; height: 44px; flex-shrink: 0">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: #F0521F; animation: v6cmHalo 9s ease infinite"></span>
<span role="button" aria-label="{{btnLabel}}" style="position: absolute; inset: 0; border-radius: 50%; background: {{btnBg}}; display: flex; align-items: center; justify-content: center; animation: v6cmBtn 9s cubic-bezier(.3,1.4,.5,1) infinite"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{btnFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{btnIcon}}"></path></svg></span>
<span aria-hidden="true" style="position: absolute; left: 4px; bottom: 96px; width: 36px; height: 76px; border-radius: 18px; background: #FBFAF6; box-shadow: 0 6px 16px rgba(23,22,26,0.2); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0; box-sizing: border-box; animation: v6cmLock 9s cubic-bezier(.3,1.3,.5,1) infinite">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0110 0v3" style="animation: v6cmShack 9s ease infinite"></path><path d="M5 11h14v10H5z"></path></svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F897C" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"></path></svg>
</span>
</span>
</div>
<span aria-hidden="true" style="position: absolute; width: 50px; height: 50px; margin: -25px; border-radius: 50%; background: rgba(23,22,26,0.18); border: 4px solid rgba(251,250,246,0.95); box-sizing: border-box; z-index: 9; animation: v6cmFinger 9s cubic-bezier(.4,0,.2,1) infinite"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["voice","circle"],"default":"voice"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const circle = (this.props.kind ?? 'voice') === 'circle';
    const H = [6, 10, 16, 12, 20, 26, 18, 10, 14, 22, 28, 20, 12, 8, 14, 24, 18, 12, 20, 26, 16, 10, 8, 14, 20, 12, 8, 6];
    return {
      isVoice: !circle, isCircle: circle,
      status: 'в сети',
      wave: H.map((h) => ({ h: String(h) })),
      live: Array.from({ length: 16 }, (_, k) => ({ t: String(0.5 + (k % 5) * 0.12), d: String(-(k % 7) * 0.1) })),
      sec: '7',
      btnBg: '#F0521F', btnFg: '#17161A',
      btnIcon: circle ? 'M4 7h11v10H4zM15 10l5-3v10l-5-3' : 'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3',
      btnLabel: circle ? 'Записать кружок' : 'Записать голосовое'
    };
  }
}
</script>
</body>
</html>
