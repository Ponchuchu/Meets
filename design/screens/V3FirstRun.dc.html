<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Первый запуск v3: 4 подсказки на вкладках</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E5DB}
@keyframes v3Up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v3Pill{0%{transform:translateY(-12px);opacity:0}15%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes v3Zoom{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes v3Pop{0%{transform:scale(0.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes v2Ring{0%{transform:scale(0.5);opacity:0.9}100%{transform:scale(1.9);opacity:0}}
@keyframes v2Plus{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes v2Bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes v3Bump{0%{transform:scale(0.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes v3Pulse{0%{transform:scale(0.6);opacity:0.6}100%{transform:scale(2.4);opacity:0}}
@keyframes v3Fade{from{opacity:0.4}to{opacity:1}}
@keyframes v3Slide{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes v3Fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(0.6);opacity:0}}
@keyframes v3Burst{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes v3Ring{0%{transform:scale(0.6);opacity:0.9}100%{transform:scale(2.2);opacity:0}}
@keyframes v3Show{from{opacity:0}to{opacity:1}}
@keyframes v3In{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.v3up{animation:v3Up 260ms cubic-bezier(.2,.8,.2,1) both}
.v3inx{animation:v3Zoom 260ms cubic-bezier(.2,.8,.2,1) both}
.v3pop{animation:v3Pop 380ms cubic-bezier(.2,.8,.2,1) both}
.v3bump{animation:v3Bump 320ms cubic-bezier(.2,.8,.2,1) both}
.v3slide{animation:v3Slide 420ms cubic-bezier(.2,.8,.2,1) both}
.v3burst{animation:v3Burst 520ms cubic-bezier(.2,.8,.2,1) both}
.v3in{animation:v3In 320ms cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
<dc-import name="V3Map" sheet="coach" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
