        rev: 'M-20 ' + mid + 'H' + (g.w + 20), L: String(g.w + 40), sw: String(g.h + 70), mw: String(g.w + 80), mh: String(g.h + 80),
        pen: 'M0 ' + Math.round(h * 0.6) + 'L' + w + ' ' + Math.round(h * 0.45),
        dotX: String(w + 2), dotY: String(Math.round(h * 0.42))
      };
    };
    return {
      word1: back ? 'с возвращением' : 'привет',
      w1: back ? word('с возвращением', 0.48) : word('привет', 1.0),
      w2: word('рядом', 1.0),
      tagline: back ? 'Данил, тут уже 3 новых события' : 'Куда пойти — и с кем'
    };
  }
}
</script>
