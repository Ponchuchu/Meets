<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["tray","search","read","closed"],"default":"tray"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const st = props.stage ?? 'tray';
    this.state = { tray: st !== 'closed' && st !== 'read', q: st === 'search' ? 'кофе' : '', cat: st === 'search' ? 'all' : 'recent', sent: st === 'read' ? ['bed'] : [] };
  }
  renderVals() {
    const PACK = (() => {
      const K = '#17161A', W = '#FBFAF6';
      const C = {
        orange: ['#FF9A6B', '#F0521F', '#B8360F'], ink: ['#55515E', '#17161A', '#000000'], blue: ['#7C95F0', '#2447B8', '#142C80'],
        green: ['#86D3A3', '#2F8F5B', '#1C6040'], peach: ['#FFE0CE', '#F7B08A', '#D9805A'], cream: ['#FFFFFF', '#F3F0E8', '#CFC9BB'],
        coffee: ['#EDB46A', '#C77A12', '#8A520A'], yellow: ['#FFEB99', '#F5C542', '#C99214'], red: ['#FF8A80', '#E0413B', '#A32620'],
        lilac: ['#E2DAFF', '#A99BEA', '#7565C2'], sky: ['#DDEEFF', '#8FC1F2', '#5A8FC7'], mint: ['#E3F6EA', '#9FD8B6', '#5FA67E']
      };
      const g = (c) => 'url(#v5g-' + c + ')';
      const grad = (c) => ({ id: 'v5g-' + c, hi: C[c][0], base: C[c][1], lo: C[c][2] });
      const sh = (d, f, s, w, a, o) => ({ d, f: f || 'none', s: s || 'none', w: String(w || 0), a: a || 'none', o: o || '60px 60px' });
      const body = (d, c) => [sh(d, W, W, 14), sh(d, g(c), K, 3.5)];
      const ell = (x, y, rx, ry) => 'M' + (x - rx) + ' ' + y + 'a' + rx + ' ' + ry + ' 0 1 0 ' + 2 * rx + ' 0a' + rx + ' ' + ry + ' 0 1 0 ' + (-2 * rx) + ' 0Z';
      const gloss = (x, y, rx, ry) => sh(ell(x, y, rx || 12, ry || 7), 'rgba(255,255,255,0.6)');
      const B = {
        blob: 'M18 58a42 42 0 1 0 84 0a42 42 0 1 0 -84 0Z',
        pin: 'M60 12C86 12 100 30 100 52C100 78 60 108 60 108C60 108 20 78 20 52C20 30 34 12 60 12Z',
        heart: 'M60 100L24 66C10 52 14 28 34 24C46 22 54 30 60 38C66 30 74 22 86 24C106 28 110 52 96 66Z',
        flame: 'M60 8C70 28 96 40 96 70A36 36 0 0 1 24 70C24 54 32 44 40 38C42 50 48 56 54 58C48 42 50 24 60 8Z',
        cloud: 'M30 90a22 22 0 0 1 0-44a28 28 0 0 1 52-8a24 24 0 0 1 8 52Z',
        ghost: 'M24 104V58a36 36 0 0 1 72 0v46l-12-8-12 8-12-8-12 8-12-8z',
        apple: 'M60 36c10-8 32-8 40 10 8 18-2 46-18 54-8 4-14 0-22 0s-14 4-22 0C22 92 12 64 20 46c8-18 30-18 40-10Z',
        cup: 'M26 48H86V70A24 24 0 0 1 62 94H50A24 24 0 0 1 26 70Z',
        clock: 'M16 60a44 44 0 1 0 88 0a44 44 0 1 0 -88 0Z',
        moon: 'M74 14a44 44 0 1 0 30 70a36 36 0 1 1 -30 -70Z',
        plate: 'M12 40L108 30L112 86L16 96Z',
        tag: 'M18 34h84a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14H18A14 14 0 0 1 4 74V48a14 14 0 0 1 14-14Z',
        bubble: 'M20 26h80a14 14 0 0 1 14 14v30a14 14 0 0 1-14 14H54L36 100l2-16H20A14 14 0 0 1 6 70V40a14 14 0 0 1 14-14Z',
        sun: 'M30 60a30 30 0 1 0 60 0a30 30 0 1 0 -60 0Z',
        umbrella: 'M12 62a48 42 0 0 1 96 0Z',
        mountain: 'M8 100L46 36L64 62L78 46L112 100Z',
        bed: 'M10 74h100v22a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8Z'
      };
      const eyes = (cx, cy, dx) => [sh(ell(cx - (dx || 12), cy, 4.5, 6), K), sh(ell(cx + (dx || 12), cy, 4.5, 6), K), sh(ell(cx - (dx || 12) + 1.5, cy - 2.5, 1.6, 1.8), W), sh(ell(cx + (dx || 12) + 1.5, cy - 2.5, 1.6, 1.8), W)];
      const smile = (cx, cy, w) => sh('M' + (cx - (w || 11)) + ' ' + cy + 'Q' + cx + ' ' + (cy + 11) + ' ' + (cx + (w || 11)) + ' ' + cy, 'none', K, 4);
      const laughEyes = (cx, cy) => sh('M' + (cx - 19) + ' ' + cy + 'q6-7 12 0M' + (cx + 7) + ' ' + cy + 'q6-7 12 0', 'none', K, 4);
      const openMouth = (cx, cy) => [sh('M' + (cx - 13) + ' ' + cy + 'h26a13 13 0 0 1-26 0Z', K, K, 2), sh('M' + (cx - 6) + ' ' + (cy + 9) + 'q6-5 12 0q-6 5-12 0Z', '#E0413B')];
      const cheeks = (cx, cy) => [sh(ell(cx - 22, cy, 6, 3.5), 'rgba(224,65,59,0.35)'), sh(ell(cx + 22, cy, 6, 3.5), 'rgba(224,65,59,0.35)')];
      const A = {
        bounce: 'v5Bounce 1.2s ease-in-out infinite', wiggle: 'v5Wiggle 1.6s ease-in-out infinite', pulse: 'v5Pulse 1s ease-in-out infinite',
        shake: 'v5Shake 0.5s ease-in-out infinite', float: 'v5Float 2.4s ease-in-out infinite', spin: 'v5Spin 6s linear infinite', none: 'none'
      };
      const hand = (x, y) => sh('M' + x + ' ' + y + 'c-4-10 0-18 6-16 2-6 10-6 11 0 4-4 10-2 10 4 4-2 9 1 8 7-1 10-8 18-18 20-8 1-14-5-17-15Z', g('peach'), K, 3, 'v5Wave 0.9s ease-in-out infinite', (x + 6) + 'px ' + (y + 12) + 'px');
      const S = [];
      const add = (id, name, cat, tags, grads, shapes, opt) => S.push(Object.assign({ id, name, cat, tags, grads: grads.map(grad), shapes, anim: 'none', text: '', hasText: false, tPos: 'left: -14%; right: -14%; bottom: 0%', fs: '0.2', tc: W, rot: '-5deg' }, opt || {}, opt && opt.text ? { hasText: true } : {}));
      // emotions
