<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таб-бар v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 96px; box-sizing: border-box; padding: 0 12px 22px; display: flex; align-items: flex-end; font-family: 'Golos Text', sans-serif">
<nav aria-label="Основная навигация" style="width: 366px; height: 66px; box-sizing: border-box; padding: 5px; border-radius: 33px; background: rgba(251,250,246,0.94); border: 1px solid rgba(23,22,26,0.08); box-shadow: 0 10px 28px rgba(23,22,26,0.16); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 28px; text-decoration: none; background: {{t.bg}}; color: {{t.fg}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11.5px; font-weight: {{t.weight}}; letter-spacing: -0.01em">{{t.label}}</span>
<sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{ false }}">
<span aria-label="{{t.badgeLabel}}" style="position: absolute; top: 3px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #F0521F; color: #17161A; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FBFAF6">{{t.badge}}</span>
</sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["map","feed","plans","chats","me"],"default":"map"},"plans":{"editor":"int","default":2,"min":0,"max":9},"chats":{"editor":"int","default":3,"min":0,"max":9},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'map';
    const plans = Number(this.props.plans ?? 2) || 0;
    const chats = Number(this.props.chats ?? 3) || 0;
    const defs = [
      { key: 'map', label: 'Карта', href: 'V3Map.dc.html', icon: 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15', badge: 0 },
      { key: 'feed', label: 'Подборка', href: 'V3Feed.dc.html', icon: 'M8.5 3h9.5a2.5 2.5 0 012.5 2.5v10a2.5 2.5 0 01-2.5 2.5h-7a2.5 2.5 0 01-2.5-2.5zM5 7.5v10.5a3 3 0 003 3h8', badge: 0 },
      { key: 'plans', label: 'Планы', href: 'V3Plans.dc.html', icon: 'M6 4.5h12a3 3 0 013 3v10.5a3 3 0 01-3 3H6a3 3 0 01-3-3V7.5a3 3 0 013-3zM3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.3 2.3 4.7-4.6', badge: plans },
      { key: 'chats', label: 'Чаты', href: 'V3Chats.dc.html', icon: 'M4 5h16v11H9l-5 4z', badge: chats },
      { key: 'me', label: 'Профиль', href: 'V3Me.dc.html', icon: 'M12 4a4 4 0 110 8 4 4 0 010-8zM4 21c1-4 4.2-6 8-6s7 2 8 6', badge: 0 }
    ];
    return {
      tabs: defs.map((d) => {
        const on = d.key === a;
        return {
          ...d,
          current: on ? 'page' : 'false',
          bg: on ? '#17161A' : 'transparent',
          fg: on ? '#F3F0E8' : '#3A3833',
          weight: on ? '600' : '500',
          hasBadge: d.badge > 0,
          badge: String(d.badge),
          badgeLabel: d.key === 'plans' ? 'Зовут: ' + d.badge : 'Непрочитанных: ' + d.badge
        };
      })
    };
  }
}
</script>
</body>
</html>
