<!doctype html>
<html lang="ru">
<head>

<title>Маршрут: машина с пробками</title>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v6rtDraw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}

@keyframes v6rtBus{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes v6rtPulse{0%{transform:scale(0.7);opacity:0.7}100%{transform:scale(2);opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
<dc-import name="V6Route" mode="car" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>

</html>
