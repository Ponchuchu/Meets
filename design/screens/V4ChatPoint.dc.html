<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чат: точка «я тут» на 15 мин, 30 мин, 2 часа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes v4cpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes v4cpPulse{0%{transform:scale(0.6);opacity:0.6}100%{transform:scale(2.6);opacity:0}}
@keyframes v4cpHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes v4cpIn{0%{transform:translateY(30px) scale(0.9);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes v4cpReply{0%,70%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E8; font-family: 'Golos Text', sans-serif; color: #17161A">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 112px; box-sizing: border-box; padding: 52px 14px 0; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E7E2D6">
<a href="V3Chats.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<img src="../assets/igor.jpg" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #2447B8">
<div><div style="font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 700">Игорь</div><div style="font-size: 12.5px; color: #5F5B55">в сети</div></div>
</div>

<div style="position: absolute; left: 0; top: 112px; width: 390px; bottom: 90px; box-sizing: border-box; padding: 0 14px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
<div style="align-self: flex-start; max-width: 260px; padding: 11px 15px; border-radius: 20px 20px 20px 6px; background: #FBFAF6; font-size: 15.5px">Ты где? Не вижу тебя</div>
<sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-end; width: 272px; border-radius: 24px 24px 8px 24px; overflow: hidden; background: #FBFAF6; box-shadow: 0 10px 26px rgba(23,22,26,0.12); animation: v4cpIn 480ms cubic-bezier(.2,.8,.2,1) both">
<div style="position: relative; width: 272px; height: 150px; overflow: hidden">
<div style="position: absolute; left: -60px; top: -310px; width: 390px; height: 844px"><dc-import name="MapBase" theme="paper" hint-size="390px,844px"></dc-import></div>
<span aria-hidden="true" style="position: absolute; left: 116px; top: 55px; width: 40px; height: 40px; border-radius: 50%; background: rgba(240,82,31,0.35); animation: v4cpPulse 1.8s ease-out infinite"></span>
<div aria-hidden="true" style="position: absolute; left: 112px; top: 34px; width: 48px; height: 60px; animation: v4cpHop 1.6s ease-in-out infinite">
<svg width="48" height="60" viewBox="0 0 48 60"><path d="M24 58S4 38 4 22a20 20 0 0140 0c0 16-20 36-20 36z" fill="#F0521F" stroke="#FBFAF6" stroke-width="3"></path></svg>
<img src="../assets/arman.jpg" alt="" style="position: absolute; left: 9px; top: 7px; width: 30px; height: 30px; border-radius: 50%; object-fit: cover">
</div>
<span style="position: absolute; right: 10px; top: 10px; padding: 5px 9px; border-radius: 10px; background: #17161A; color: #F3F0E8; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums">ЕЩЁ {{left}}</span>
</div>
<div style="padding: 12px 14px">
<div style="font-family: 'Geologica', sans-serif; font-size: 17px; font-weight: 700">Я тут</div>
<div style="margin-top: 2px; font-size: 13px; color: #5F5B55">Кофейня на углу · Абая и Достык</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px">
<span style="font-size: 12px; color: #8A857C">Игорь видит, пока точка горит</span>
<button type="button" onClick="{{remove}}" style="height: 34px; padding: 0 12px; border-radius: 11px; border: 0; background: #E7E2D6; font-family: 'Golos Text', sans-serif; font-size: 13px; font-weight: 700; color: #17161A">Убрать</button>
</div>
</div>
</div>
<div style="align-self: flex-start; max-width: 260px; padding: 11px 15px; border-radius: 20px 20px 20px 6px; background: #FBFAF6; font-size: 15.5px; animation: v4cpReply 2.6s ease both">Вижу! Иду, 6 минут</div>
</sc-if>
</div>

<div style="position: absolute; left: 0; bottom: 26px; width: 390px; height: 64px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{openPick}}" aria-label="Позвать, точка, фото" style="width: 46px; height: 46px; border-radius: 23px; border: 0; background: #E7E2D6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<div style="flex: 1; height: 46px; border-radius: 23px; background: #FBFAF6; box-shadow: inset 0 0 0 1.5px #E7E2D6; display: flex; align-items: center; padding-left: 16px; font-size: 15px; color: #8A857C">Сообщение</div>
</div>

<sc-if value="{{isPick}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(23,22,26,0.35)"></span>
<div role="dialog" aria-label="Точка" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 16px 30px; border-radius: 28px 28px 0 0; background: #FBFAF6; animation: v4cpSheet 360ms cubic-bezier(.2,.8,.2,1) both">
<span aria-hidden="true" style="display: block; width: 40px; height: 5px; border-radius: 3px; background: #CFC9BB; margin: 0 auto 12px"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Geologica', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Точка «я тут»</span>
<button type="button" onClick="{{closePick}}" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F3F0E8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="position: relative; margin-top: 10px; width: 358px; height: 210px; border-radius: 20px; overflow: hidden">
<div style="position: absolute; left: -16px; top: -290px; width: 390px; height: 844px"><dc-import name="MapBase" theme="paper" hint-size="390px,844px"></dc-import></div>
<span aria-hidden="true" style="position: absolute; left: 159px; top: 96px; width: 40px; height: 40px; border-radius: 50%; background: rgba(240,82,31,0.35); animation: v4cpPulse 1.8s ease-out infinite"></span>
<div aria-hidden="true" style="position: absolute; left: 155px; top: 64px; width: 48px; height: 60px; animation: v4cpHop 1.6s ease-in-out infinite">
<svg width="48" height="60" viewBox="0 0 48 60"><path d="M24 58S4 38 4 22a20 20 0 0140 0c0 16-20 36-20 36z" fill="#F0521F" stroke="#FBFAF6" stroke-width="3"></path></svg>
<img src="../assets/arman.jpg" alt="" style="position: absolute; left: 9px; top: 7px; width: 30px; height: 30px; border-radius: 50%; object-fit: cover">
</div>
<span style="position: absolute; left: 10px; bottom: 10px; padding: 6px 10px; border-radius: 10px; background: rgba(23,22,26,0.82); color: #F3F0E8; font-size: 12px; font-weight: 600">Двигай карту — точка в центре</span>
</div>
<div style="margin-top: 12px; font-family: 'Geologica', sans-serif; font-size: 17px; font-weight: 700">Кофейня на углу</div>
<div style="font-size: 13px; color: #5F5B55">Это ты · точность 10 м</div>
<div style="margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #5F5B55">СКОЛЬКО ПОКАЗЫВАТЬ</div>
<div role="radiogroup" aria-label="Сколько показывать точку" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; padding: 4px; border-radius: 16px; background: #F3F0E8">
<sc-for list="{{lives}}" as="l" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="height: 46px; border-radius: 13px; border: 0; background: {{l.bg}}; color: {{l.fg}}; font-family: 'Golos Text', sans-serif; font-size: 15px; font-weight: 700; transition: background 180ms ease">{{l.label}}</button>
</sc-for>
</div>
<button type="button" onClick="{{send}}" style="margin-top: 14px; width: 100%; height: 56px; border-radius: 18px; border: 0; background: #F0521F; color: #17161A; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Golos Text', sans-serif; font-size: 16.5px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"></path></svg>Отправить Игорю</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["pick","sent"],"default":"pick"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const st = props.stage ?? 'pick';
    this.state = { stage: st, life: 30, left: 30 * 60 - 2 };
  }
  componentDidMount() { this.iv = setInterval(() => { if (this.state.stage === 'sent') this.setState({ left: Math.max(0, this.state.left - 1) }); }, 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const s = this.state;
    const p2 = (v) => String(v).padStart(2, '0');
    const L = s.left;
    const left = L >= 3600 ? Math.floor(L / 3600) + ':' + p2(Math.floor((L % 3600) / 60)) + ':' + p2(L % 60) : p2(Math.floor(L / 60)) + ':' + p2(L % 60);
    return {
      isPick: s.stage === 'pick', isSent: s.stage === 'sent', left,
      lives: [[15, '15 мин'], [30, '30 мин'], [120, '2 часа']].map(([v, label]) => ({ label, on: s.life === v ? 'true' : 'false', bg: s.life === v ? '#17161A' : 'transparent', fg: s.life === v ? '#F3F0E8' : '#17161A', pick: () => this.setState({ life: v }) })),
      send: () => this.setState({ stage: 'sent', left: this.state.life * 60 }),
      openPick: () => this.setState({ stage: 'pick' }), closePick: () => this.setState({ stage: 'chat' }),
      remove: () => this.setState({ stage: 'chat' })
    };
  }
}
</script>
</body>
</html>
