<x-dc>
<helmet>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #55524C">ДРУГ С ГЕОЛОКАЦИЕЙ · ИГОРЬ</span><span style="font-family: 'Geologica', sans-serif; font-size: 20px; font-weight: 600">Кнопка ведёт на общую карту</span></div>

<dc-import name="DirectChat" friend="{{yes}}" sheet="{{yes}}" hint-size="390px,900px"></dc-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, no: false }; }
}
</script>
