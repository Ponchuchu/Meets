<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таб-бар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Основная навигация" style="width: 390px; height: 84px; box-sizing: border-box; background: #F3F0E8; border-top: 1px solid #DDD8CC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-family: 'Golos Text', sans-serif">
<a href="Main.dc.html" aria-current="{{map.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: {{map.color}}; font-size: 11px; font-weight: {{map.weight}}">
<span style="position: absolute; top: -1px; width: 24px; height: 3px; border-radius: 0 0 3px 3px; background: {{map.bar}}"></span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>
<span>Карта</span>
</a>
<a href="Feed.dc.html" aria-current="{{foryou.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: {{foryou.color}}; font-size: 11px; font-weight: {{foryou.weight}}">
<span style="position: absolute; top: -1px; width: 24px; height: 3px; border-radius: 0 0 3px 3px; background: {{foryou.bar}}"></span>
<sc-if value="{{showFresh}}" hint-placeholder-val="{{ true }}">
<span aria-label="Есть новые карточки" style="position: absolute; top: 9px; left: 48px; width: 9px; height: 9px; border-radius: 50%; background: #F0521F; box-shadow: 0 0 0 2px #F3F0E8"></span>
</sc-if>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="3" width="12" height="15" rx="2.5"></rect><path d="M5 7.5v10.5a3 3 0 003 3h8"></path></svg>
<span>Для тебя</span>
</a>
<a href="Chats.dc.html" aria-current="{{chats.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: {{chats.color}}; font-size: 11px; font-weight: {{chats.weight}}">
<span style="position: absolute; top: -1px; width: 24px; height: 3px; border-radius: 0 0 3px 3px; background: {{chats.bar}}"></span>
<span aria-label="2 непрочитанных" style="position: absolute; top: 6px; left: 44px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #F0521F; color: #17161A; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #F3F0E8">2</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
<span>Чаты</span>
</a>
<a href="Friends.dc.html" aria-current="{{people.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: {{people.color}}; font-size: 11px; font-weight: {{people.weight}}">
<span style="position: absolute; top: -1px; width: 24px; height: 3px; border-radius: 0 0 3px 3px; background: {{people.bar}}"></span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"></path></svg>
<span>Люди</span>
</a>
<a href="Me.dc.html" aria-current="{{me.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: {{me.color}}; font-size: 11px; font-weight: {{me.weight}}">
<span style="position: absolute; top: -1px; width: 24px; height: 3px; border-radius: 0 0 3px 3px; background: {{me.bar}}"></span>
<sc-if value="{{hasPlans}}" hint-placeholder-val="{{ false }}">
<span aria-label="{{plansLabel}}" style="position: absolute; top: 6px; left: 44px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #17161A; color: #F3F0E8; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #F3F0E8">{{plans}}</span>
</sc-if>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"></path></svg>
<span>Профиль</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["map","foryou","chats","people","me"],"default":"map"},"plans":{"editor":"int","default":0,"min":0,"max":9},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'map';
    const plans = Number(this.props.plans ?? 0) || 0;
    const tab = (key) => a === key
      ? { color: '#17161A', weight: '600', bar: '#F0521F', current: 'page' }
      : { color: '#6B675F', weight: '500', bar: 'transparent', current: 'false' };
    return {
      map: tab('map'), foryou: tab('foryou'), people: tab('people'), chats: tab('chats'), me: tab('me'),
      showFresh: a !== 'foryou',
      hasPlans: plans > 0,
      plans: String(plans),
      plansLabel: 'Новых планов: ' + plans
    };
  }
}
</script>
</body>
</html>
