# Настройки для Supabase CLI (npm run functions:deploy). Проект: xkpchsommtilristiesu.
project_id = "xkpchsommtilristiesu"

# deck — с входом (JWT приложения); weather и notify зовёт только база с секретом CRON_SECRET.
[functions.deck]
verify_jwt = true

[functions.weather]
verify_jwt = false

[functions.notify]
verify_jwt = false

# alpha-login — вход тестеров без SMS (до входа JWT нет).
[functions.alpha-login]
verify_jwt = false

[functions.route]
verify_jwt = true

[functions.bump]
verify_jwt = true

# robot-run — из панели (JWT staff) и из robot-tick (CRON_SECRET), поэтому проверка JWT — в коде.
[functions.robot-run]
verify_jwt = false

[functions.robot-tick]
verify_jwt = false

[functions.geocode]
verify_jwt = false

[functions.traffic-score]
verify_jwt = false
