# Обновление сервера после исправлений с телефона. Сначала миграции, затем функции.
# SUPABASE_ACCESS_TOKEN хранится только в GitHub Actions Secrets (docs/KEYS.md).
name: Supabase backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверить доступ
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Добавь SUPABASE_ACCESS_TOKEN в Actions Secrets — инструкция в docs/KEYS.md"
            exit 1
          fi
      - run: npm run typecheck && npm test -- --ci --runInBand
      - name: Встречи, группы и награды
        run: npm run db:migrate -- 20261006000018
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Собрать общий код и обновить функции
        run: npm run functions:deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
