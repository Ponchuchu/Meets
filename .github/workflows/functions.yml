# Обновление сервера после исправлений с телефона. Сначала миграции, затем функции.
# SUPABASE_ACCESS_TOKEN хранится только в GitHub Actions Secrets (docs/KEYS.md).
name: Supabase backend
on:
  workflow_dispatch:
  push:
    tags: ['backend-review-*']
permissions:
  contents: write
concurrency:
  group: supabase-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверить доступ
        id: supabase-token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Добавь SUPABASE_ACCESS_TOKEN в Actions Secrets — инструкция в docs/KEYS.md"
            exit 1
          fi
      - run: npm run typecheck && npm test -- --ci --runInBand && npm run test:sql
      - name: Встречи, группы и награды
        run: npm run db:migrate -- 20261006000018
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Исправления панели и сохранение планов
        id: migration
        run: |
          # Уже применены в базе (21 окт.): 19–27 (12 окт.), 24, 29–34 (20–21 окт.). Повторять их нельзя: 29 проверяет старый
          # список рамок, а люди уже выбрали новые (миграция 30). Сюда добавляем только новые миграции.
          for migration in 20261021000035 20261021000036 20261021000037 20261021000038 20261021000039; do
            npm run db:migrate -- "$migration"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Собрать общий код и обновить функции
        id: deploy
        run: npm run functions:deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Поиск использует ту же версию кода, что и сервер
        run: supabase secrets set --project-ref xkpchsommtilristiesu ROBOT_GITHUB_REF="$GITHUB_REF_NAME"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Сохранить результат обновления
        if: always() && startsWith(github.ref, 'refs/tags/backend-review-')
        env:
          RESULT_STATUS: ${{ job.status }}
          RESULT_STAGE: ${{ steps.supabase-token.outcome == 'failure' && 'supabase-token' || steps.migration.outcome == 'failure' && 'migration' || steps.deploy.outcome }}
        run: node scripts/report-action.mjs
