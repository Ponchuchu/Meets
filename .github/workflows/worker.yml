# Сборщик событий. Без секретов — демо-прогон на fixtures.
# Сам по расписанию НЕ запускается (выключено 5 октября). Запуск — вручную, позже — из панели разработчика.
name: worker
on:
  workflow_dispatch:
concurrency: worker
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сбор и разбор постов
        run: node worker/src/index.ts
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI }}
