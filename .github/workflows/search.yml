# Поиск событий ИИ раз в сутки (08:40 по Алматы): Gemini API ищет в интернете → проверка страниц → «Согласование».
# Секреты (docs/KEYS.md): GEMINI_API_KEY, SUPABASE_SECRET_KEY. Модель — переменная GEMINI_MODEL (необязательно).
# Без ключа Gemini шаг поиска пропускается, ничего не ломается. Обычно весь запуск — 1–2 минуты.
name: search
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
concurrency: worker
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Шаг поиска не видит ключей базы: страницы из интернета читает ИИ, и они не должны до них дотянуться.
      - name: Поиск событий (Gemini API, 6 разделов параллельно + проверка страниц)
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node worker/src/search.ts --run > search.json
      - name: Что нашёл ИИ (файл для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ github.run_id }}
          path: search.json
          retention-days: 14
      - name: Черновики в «Согласование»
        run: node worker/src/index.ts --search search.json --no-images
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
