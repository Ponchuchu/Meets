# Поиск событий ИИ: Gemini API ищет в интернете → проверка страниц → «Согласование».
# Сам по расписанию НЕ запускается (выключено 5 октября по просьбе владельца). Запуск — вручную (Actions → Run workflow), позже — кнопкой «Искать сейчас» в панели разработчика.
# Секреты (docs/KEYS.md): GEMINI_API_KEY или KIMI_API_KEY (ИИ выбирается по имени модели: gemini-… или kimi-…), SUPABASE_SECRET_KEY. Модель — переменная GEMINI_MODEL (необязательно).
# Без ключа Gemini шаг поиска пропускается, ничего не ломается. Обычно весь запуск — 1–2 минуты.
name: search
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: ''
      topics:
        type: string
        default: ''
      days:
        type: string
        default: '7'
      limit:
        type: string
        default: '40'
      model:
        type: string
        default: 'gemini-2.5-flash'
      find_images:
        type: string
        description: 'Сколько карточек без фото дать Kimi на поиск картинки (0 — не искать)'
        default: '6'
      sources:
        type: string
        description: 'sites — только афиши сайтов без ИИ (бесплатно), ai — только ИИ, all — оба'
        default: 'sites'
      sites:
        type: string
        description: 'Какие афиши читать: yandex,sxodim (none — никакие). Панель берёт из «Настройки → Источники»'
        default: 'yandex,sxodim'
      telegram:
        type: string
        description: '1 — после афиш разобрать новые посты Telegram-каналов (ИИ отсеивает рекламу и мемы)'
        default: '0'
concurrency: worker
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROBOT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Статус запуска и проверка ключей
        run: node worker/src/robot.ts start
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Сами ключи в журнал не попадают: только «есть / нет» и баланс Kimi.
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.KIMI }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
      # Шаг поиска не видит ключей базы: страницы из интернета читает ИИ, и они не должны до них дотянуться.
      - name: Поиск событий (Gemini или Kimi, 6 разделов параллельно + проверка страниц)
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.KIMI }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SEARCH_TOPICS: ${{ inputs.topics }}
          SEARCH_SOURCES: ${{ inputs.sources || 'sites' }}
          SEARCH_SITES_ON: ${{ inputs.sites || 'yandex,sxodim' }}
          SEARCH_FIND_IMAGES: ${{ inputs.find_images || '6' }}
          SEARCH_DAYS: ${{ inputs.days }}
          SEARCH_LIMIT: ${{ inputs.limit }}
        run: node worker/src/search.ts --run > search.json 2> search.log || code=$?; cat search.log >&2; exit ${code:-0}
      - name: Что нашёл ИИ (файл для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ github.run_id }}
          path: |
            search.json
            search-report.json
          retention-days: 14
      - name: Черновики в «Согласование»
        run: node worker/src/index.ts --search search.json --no-images
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Описания карточек оформляет Kimi (worker/src/polish.ts); без ключа — аккуратно обрезанный текст афиши.
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.KIMI }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
      # Telegram: ИИ решает, где событие, а где реклама и мемы. Явная реклама отсеивается без ИИ. Сбой канала не роняет весь запуск.
      - name: Telegram-каналы (новые посты)
        if: ${{ !cancelled() && inputs.telegram == '1' }}
        continue-on-error: true
        run: node worker/src/index.ts --telegram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.KIMI }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
      # Постоянные места: часы с перерывами и цены (с сайтов мест). Сбой не роняет запуск.
      - name: Постоянные места — часы и цены
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node worker/src/spots.ts --run
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Результат запуска
        if: always()
        run: node worker/src/robot.ts finish
        env:
          ROBOT_JOB_STATUS: ${{ job.status }}
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
