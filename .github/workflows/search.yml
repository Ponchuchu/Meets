# Сбор событий скриптом, без ИИ (26 октября, решение владельца): сайты-афиши → Telegram → Instagram и Threads → «Согласование» или сразу на карту.
# Запуск — кнопкой «Собрать сейчас» в панели разработчика или по расписанию (robot-tick). Instagram читает функция Supabase social (ключи IG_TOKEN, IG_USER_ID — в секретах Supabase).
# Секрет GitHub: SUPABASE_SECRET_KEY. Обычно весь запуск — 3–6 минут.
name: search
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: ''
      topics:
        type: string
        default: ''
      days:
        type: string
        default: '7'
      limit:
        type: string
        default: '40'
      model:
        type: string
        default: 'gemini-2.5-flash'
      find_images:
        type: string
        description: 'Сколько карточек без фото дать Kimi на поиск картинки (0 — не искать)'
        default: '6'
      sources:
        type: string
        description: 'sites — только афиши сайтов без ИИ (бесплатно), ai — только ИИ, all — оба'
        default: 'sites'
      sites:
        type: string
        description: 'Какие афиши читать: yandex,sxodim (none — никакие). Панель берёт из «Настройки → Источники»'
        default: 'yandex,sxodim'
      telegram:
        type: string
        description: '1 — после афиш разобрать новые посты Telegram-каналов'
        default: '0'
      social:
        type: string
        description: '1 — страницы Instagram и Threads из «Источников»'
        default: '1'
concurrency: worker
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROBOT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Статус запуска и проверка ключей
        run: node worker/src/robot.ts start
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Шаг поиска не видит ключей базы: страницы из интернета читает ИИ, и они не должны до них дотянуться.
      # ИИ-поиск по интернету выключен (26 окт.): только сайты-афиши, их читает код.
      - name: Сайты-афиши (код, без ИИ)
        timeout-minutes: 15
        env:
          SEARCH_TOPICS: ${{ inputs.topics }}
          SEARCH_SOURCES: sites
          SEARCH_SITES_ON: ${{ inputs.sites || 'yandex,sxodim' }}
          SEARCH_FIND_IMAGES: '0'
          SEARCH_DAYS: ${{ inputs.days }}
          SEARCH_LIMIT: ${{ inputs.limit }}
        run: node worker/src/search.ts --run > search.json 2> search.log || code=$?; cat search.log >&2; exit ${code:-0}
      - name: Что нашёл ИИ (файл для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ github.run_id }}
          path: |
            search.json
            search-report.json
          retention-days: 14
      - name: Черновики в «Согласование»
        if: ${{ inputs.sites != 'none' }}
        run: node worker/src/index.ts --search search.json --no-images
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Telegram: разбор скриптом, как у Instagram. Сбой канала не роняет весь запуск.
      - name: Telegram-каналы (новые посты)
        if: ${{ !cancelled() && inputs.telegram == '1' }}
        continue-on-error: true
        run: node worker/src/index.ts --telegram
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Instagram и Threads: посты страниц → события (одна карточка — все даты), фото и видео — копии в хранилище.
      - name: Instagram и Threads
        if: ${{ !cancelled() && inputs.social != '0' }}
        continue-on-error: true
        timeout-minutes: 25
        run: node worker/src/index.ts --social
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SOCIAL_VIDEOS: '20'
      # Постоянные места: часы с перерывами и цены (с сайтов мест). Сбой не роняет запуск.
      - name: Постоянные места — часы и цены
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node worker/src/spots.ts --run
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Результат запуска
        if: always()
        run: node worker/src/robot.ts finish
        env:
          ROBOT_JOB_STATUS: ${{ job.status }}
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
