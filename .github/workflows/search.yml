# Поиск событий ИИ: Gemini API ищет в интернете → проверка страниц → «Согласование».
# Сам по расписанию НЕ запускается (выключено 5 октября по просьбе владельца). Запуск — вручную (Actions → Run workflow), позже — кнопкой «Искать сейчас» в панели разработчика.
# Секреты (docs/KEYS.md): GEMINI_API_KEY или KIMI_API_KEY (ИИ выбирается по имени модели: gemini-… или kimi-…), SUPABASE_SECRET_KEY. Модель — переменная GEMINI_MODEL (необязательно).
# Без ключа Gemini шаг поиска пропускается, ничего не ломается. Обычно весь запуск — 1–2 минуты.
name: search
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: ''
      topics:
        type: string
        default: ''
      days:
        type: string
        default: '7'
      limit:
        type: string
        default: '40'
      model:
        type: string
        default: 'gemini-2.5-flash'
concurrency: worker
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBOT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Статус запуска
        run: node worker/src/robot.ts start
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Шаг поиска не видит ключей базы: страницы из интернета читает ИИ, и они не должны до них дотянуться.
      - name: Поиск событий (Gemini или Kimi, 6 разделов параллельно + проверка страниц)
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.KIMI }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SEARCH_TOPICS: ${{ inputs.topics }}
          SEARCH_DAYS: ${{ inputs.days }}
          SEARCH_LIMIT: ${{ inputs.limit }}
        run: node worker/src/search.ts --run > search.json
      - name: Что нашёл ИИ (файл для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ github.run_id }}
          path: search.json
          retention-days: 14
      - name: Черновики в «Согласование»
        run: node worker/src/index.ts --search search.json --no-images
        env:
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Результат запуска
        if: always()
        run: node worker/src/robot.ts finish
        env:
          ROBOT_JOB_STATUS: ${{ job.status }}
          SUPABASE_URL: https://xkpchsommtilristiesu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
