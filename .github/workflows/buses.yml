# Остановки автобусов Алматы с координатами из OpenStreetMap → data/seed/bus-stops-almaty.json (коммит в main).
# Запуск только вручную: Actions → buses → Run workflow. Ключи не нужны.
name: buses
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Забрать остановки из OpenStreetMap
        run: node worker/src/busstops.ts
      - name: Сохранить в репозиторий
        run: |
          git config user.name "ryadom-bot"
          git config user.email "ryadom-bot@users.noreply.github.com"
          cp data/seed/bus-stops-almaty.json /tmp/bus-stops.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/bus-stops.json data/seed/bus-stops-almaty.json
          git add data/seed/bus-stops-almaty.json
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Остановки автобусов из OpenStreetMap"
          git push origin main
