# Политика для Gemini CLI в сборщике событий: только искать и читать страницы.
# Никаких команд, файлов и записи — страницы из интернета могут содержать «инструкции» для ИИ.
[[rule]]
toolName = ["google_web_search", "web_fetch"]
decision = "allow"
priority = 900

[[rule]]
toolName = ["run_shell_command", "write_file", "replace", "read_file", "read_many_files", "glob", "grep_search", "list_directory", "save_memory"]
decision = "deny"
priority = 990
denyMessage = "Сборщику событий нужны только поиск и чтение страниц."
